<!DOCTYPE html>
<html lang="fr">
<head>
<script src="lock.js"></script>
<script src="/api/config"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Calendrier · Tableau de bord</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="topbar.js" defer></script>

<style>
:root {
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --success: #6BE3A4;
  --warning: #F2C063;
  --danger:  #FF6B6B;
  --indigo: #818CF8;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: #050506; color: var(--text-secondary);
  font-family: var(--font); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh; position: relative; overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(129,140,248,0.14), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(180,180,200,0.06), transparent 50%);
  filter: blur(40px); pointer-events: none; z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px; pointer-events: none; z-index: -1;
}
@keyframes drift { 0%{transform:translate3d(0,0,0)} 100%{transform:translate3d(-22px,14px,0)} }
.atmo-wash {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(60% 50% at 50% 20%, rgba(129,140,248,0.14) 0%, rgba(129,140,248,0.05) 35%, transparent 65%),
    radial-gradient(50% 40% at 80% 85%, rgba(76,46,201,0.10) 0%, transparent 60%),
    radial-gradient(120% 80% at 50% 100%, rgba(16,14,38,0.5) 0%, rgba(4,6,10,0.95) 75%);
  background-repeat: no-repeat; background-size: 100% 100%;
}
.atmo-particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.atmo-particles span {
  position: absolute; width: 1.5px; height: 1.5px; border-radius: 50%;
  background: rgba(200,200,255,0.7);
  animation: atmo-drift linear infinite;
  box-shadow: 0 0 6px rgba(129,140,248,0.55);
}
@keyframes atmo-drift {
  0%   { transform: translate3d(0, 0, 0); opacity: 0; }
  10%  { opacity: 0.7; } 90%  { opacity: 0.5; }
  100% { transform: translate3d(var(--dx, 12px), var(--dy, -100vh), 0); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .atmo-particles span { animation: none; } }

.page { max-width: 640px; margin: 0 auto; position: relative; z-index: 5; }
.dash-title {
  margin: 0 0 4px; font-size: 28px; font-weight: 700; letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.dash-sub { margin: 0 0 18px; font-size: 13px; line-height: 1.5; color: var(--text-tertiary); }
.gm-card {
  position: relative; background: rgba(255, 255, 255, 0.04); border-radius: 16px;
  padding: 20px; margin-bottom: 14px;
  backdrop-filter: blur(24px) saturate(1.2); -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
}
.section-title {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-tertiary); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
details.info {
  margin: 0 0 18px; padding: 2px 18px; font-size: 12.5px; color: var(--text-secondary); line-height: 1.55;
}
details.info summary { cursor: pointer; padding: 12px 0; color: var(--text-primary); font-weight: 600; list-style: none; }
details.info summary::-webkit-details-marker { display: none; }
details.info p { margin: 8px 0; } details.info strong { color: var(--text-primary); }

/* ---- month calendar ---- */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-nav-btn {
  width: 32px; height: 32px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.04); color: var(--text-primary); font-size: 16px; line-height: 1;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.cal-nav-btn:hover { background: rgba(255,255,255,0.08); }
.cal-month { font-size: 14px; font-weight: 700; color: var(--text-primary); }
.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 5px; }
.cal-weekday { text-align: center; font-size: 9.5px; font-weight: 700; color: var(--text-tertiary); letter-spacing: 0.06em; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-cell {
  aspect-ratio: 0.82; border-radius: 9px; background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06); border-left: 3px solid transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 3px 2px; font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, border-color 0.15s;
}
.cal-cell:hover { background: rgba(255,255,255,0.06); }
.cal-cell.train { border-left-color: var(--indigo); }
.cal-cell.rest { border-left-color: rgba(255,255,255,0.18); }
.cal-cell.today { background: rgba(129,140,248,0.12); border-color: rgba(129,140,248,0.4); }
.cal-cell.manual { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); }
.cal-day { font-size: 10.5px; font-weight: 700; color: var(--text-primary); }
.cal-split { font-size: 7.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-tertiary); text-align: center; line-height: 1.15; }
.cal-cell.train .cal-split { color: var(--indigo); }
.cal-kcal { font-size: 8.5px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); }
.cal-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-tertiary); }
.cal-legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.cal-legend-dot.train { background: var(--indigo); }
.cal-legend-dot.rest { background: rgba(255,255,255,0.25); }

/* ---- today summary ---- */
.today-row { display: flex; align-items: center; gap: 14px; }
.today-badge {
  width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 24px;
  background: rgba(129,140,248,0.12); border: 1px solid rgba(129,140,248,0.3);
}
.today-info { flex: 1; min-width: 0; }
.today-split { font-size: 17px; font-weight: 700; color: var(--text-primary); }
.today-kcal { font-size: 12.5px; color: var(--text-tertiary); margin-top: 2px; }
.today-links { display: flex; gap: 8px; margin-top: 14px; }
.today-link {
  flex: 1; text-align: center; padding: 11px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.04); color: var(--text-primary); text-decoration: none;
  font-size: 12.5px; font-weight: 700; transition: background 0.15s;
}
.today-link:hover { background: rgba(255,255,255,0.08); }
.program-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 12.5px; }
.program-row:last-child { border-bottom: 0; }
.program-row span:first-child { color: var(--text-tertiary); }
.program-row span:last-child { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }
.program-note { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06); font-size: 12px; color: var(--text-tertiary); line-height: 1.5; }

/* ---- calendar subscription ---- */
.sub-row { display: flex; gap: 8px; align-items: stretch; }
.sub-url {
  flex: 1; min-width: 0; padding: 11px 13px; border-radius: 11px; border: 1px solid rgba(255,255,255,0.08);
  background: rgba(0,0,0,0.28); color: var(--text-secondary); font-family: var(--font-mono); font-size: 12px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center;
}
.sub-copy {
  flex-shrink: 0; padding: 0 16px; border: 0; border-radius: 11px; cursor: pointer;
  background: linear-gradient(180deg, #FFFFFF 0%, #E8E5DD 100%); color: #0A0A0B;
  font-family: inherit; font-size: 12.5px; font-weight: 700;
}
.sub-copy.done { background: linear-gradient(180deg, #A7F3D0 0%, #6BE3A4 100%); }
.sub-steps { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); }
.sub-steps b { color: var(--text-primary); }
.sub-steps ol { margin: 8px 0 0; padding-left: 18px; font-size: 12px; color: var(--text-tertiary); line-height: 1.7; }

/* ---- day picker modal ---- */
.modal-bg {
  position: fixed; inset: 0; z-index: 100; display: none;
  align-items: flex-end; justify-content: center; padding: 0;
  background: rgba(0,0,0,0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.modal-bg.show { display: flex; }
.modal {
  background: #14140f; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px 20px 0 0;
  padding: 22px 18px max(22px, env(safe-area-inset-bottom)); width: 100%; max-width: 420px;
}
@media (min-width: 820px) {
  .modal-bg { align-items: center; padding: 24px; }
  .modal { border-radius: 20px; }
}
.modal h3 { margin: 0 0 14px; font-size: 16px; color: var(--text-primary); text-transform: capitalize; }
.empty-note { text-align: center; font-size: 13px; color: var(--text-tertiary); padding: 10px 4px; line-height: 1.6; }
.day-pick-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.day-pick-btn {
  padding: 10px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.04); color: var(--text-primary); font-family: inherit;
  font-size: 13px; font-weight: 600; cursor: pointer;
}
.day-pick-btn:hover { background: rgba(255,255,255,0.08); }
.day-pick-btn.current { border-color: rgba(129,140,248,0.5); background: rgba(129,140,248,0.14); }
.modal-actions { display: flex; gap: 8px; margin-top: 6px; }
.modal-actions button { flex: 1; padding: 12px; border-radius: 12px; font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; }
.btn-secondary { border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.04); color: var(--text-primary); }
.btn-secondary:hover { background: rgba(255,255,255,0.08); }

.cross-nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.cross-nav a {
  display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.035);
  color: var(--text-secondary); text-decoration: none; font-size: 12.5px; font-weight: 600;
}
.cross-nav a:hover { background: rgba(255,255,255,0.07); color: var(--text-primary); }

@media (max-width: 480px) {
  body { padding: max(20px, env(safe-area-inset-top)) 14px 50px; }
  .dash-title { font-size: 22px; }
  .cal-split { display: none; }
}
</style>
</head>
<body>

<div id="atmo-backdrop" aria-hidden="true">
  <div class="atmo-wash"></div>
  <div class="atmo-particles" id="atmoParticles"></div>
</div>

<div class="page" id="app"></div>

<script>
(async function(){
  'use strict';

  const WATER_KEY = 'po_water_v1';
  const GYM_KEY = 'po_coach_v1';
  const WEIGHTS_KEY = 'po_coach_weights';
  const PROGRAM_KEY = 'po_nutrition_program_v1';
  const OVERRIDES_KEY = 'po_day_overrides_v1';

  function loadJSON(k, fallback) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fallback : v; } catch (e) { return fallback; } }
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function dateKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

  // ================================================================
  // CLOUD SYNC — same Supabase row Fitness (gym.html) already syncs
  // (appKey "po-coach"), so a manual day placed here reaches every
  // device and shows up consistently in Alimentation/Caféine's rest-day
  // detection and the /api/calendar.ics feed too.
  // ================================================================
  const PC_APP_KEY = 'po-coach';
  const PC_SUPABASE_URL = window.DASH_SUPABASE_URL || 'https://srajryooffirbroltjmg.supabase.co';
  const PC_SUPABASE_KEY = window.DASH_SUPABASE_KEY || 'sb_publishable_5142ZwTLF_DkSVRzciNuRA_bHwRAu4c';
  const PC_SYNCED_KEYS = ['po_coach_v1', 'po_coach_workout_done', 'po_coach_weights', 'po_coach_photos', 'po_motivation_v1', 'po_day_overrides_v1'];
  let pcSupa = null;
  if (window.supabase && PC_SUPABASE_URL.indexOf('PASTE-') !== 0 && PC_SUPABASE_KEY.indexOf('PASTE-') !== 0) {
    try { pcSupa = window.supabase.createClient(PC_SUPABASE_URL, PC_SUPABASE_KEY); } catch (e) {}
  }
  async function pcPullOnce() {
    if (!pcSupa) return;
    try {
      const result = await Promise.race([
        pcSupa.from('app_state').select('data').eq('key', PC_APP_KEY).maybeSingle(),
        new Promise((resolve) => setTimeout(() => resolve(null), 4000))
      ]);
      if (!result) return;
      const { data, error } = result;
      if (!error && data && data.data) {
        Object.keys(data.data).forEach(k => {
          if (PC_SYNCED_KEYS.indexOf(k) === -1) return;
          try { localStorage.setItem(k, JSON.stringify(data.data[k])); } catch (e) {}
        });
      }
    } catch (e) {}
  }
  async function pcPushNow() {
    if (!pcSupa) return;
    const out = {};
    PC_SYNCED_KEYS.forEach(k => {
      const v = localStorage.getItem(k);
      if (v == null) return;
      try { out[k] = JSON.parse(v); } catch (e) { out[k] = v; }
    });
    try {
      await pcSupa.from('app_state').upsert(
        { key: PC_APP_KEY, data: out, updated_at: new Date().toISOString() }, { onConflict: 'key' }
      );
    } catch (e) {}
  }
  function saveJSON(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); pcPushNow(); return true; }
    catch (e) { console.error('save failed', k, e); return false; }
  }

  function isRestLabel(label) { return /repos|rest/i.test(label || ''); }

  // ================================================================
  // TDEE — same Mifflin-St Jeor + activity-tier + rest-day-drop formula
  // as Alimentation (see that page's "D'où viennent ces chiffres" for the
  // citations: Mifflin-St Jeor 1990, Frankenfield et al. 2005). This page
  // only needs two numbers (train-day kcal, rest-day kcal), not the full
  // adaptive weekly recompute — it reads the program's current deficit
  // rather than re-running that logic, since Alimentation already owns it.
  // ================================================================
  function readProfile() {
    const w = loadJSON(WATER_KEY, null);
    return (w && w.profile) || { weightKg: 75, age: 25, sex: 'm', activityHrsPerWeek: 5, heightCm: 175 };
  }
  function readLiveWeightKg() {
    const entries = loadJSON(WEIGHTS_KEY, []);
    if (!entries.length) return null;
    const gym = loadJSON(GYM_KEY, {});
    const unit = (gym && gym.units) || 'kg';
    const latest = entries[entries.length - 1];
    return unit === 'lb' ? latest.weight / 2.20462 : latest.weight;
  }
  function computeBMR(profile, weightKg) {
    const s = profile.sex === 'f' ? -161 : (profile.sex === 'm' ? 5 : -78);
    return 10 * weightKg + 6.25 * (profile.heightCm || 175) - 5 * (profile.age || 25) + s;
  }
  function activityMultiplier(hrsPerWeek) {
    const h = hrsPerWeek || 0;
    if (h < 2) return 1.2; if (h < 4) return 1.375; if (h < 7) return 1.55; if (h < 10) return 1.725; return 1.9;
  }
  function computeTDEE(profile, weightKg, restDay) {
    const tiers = [1.2, 1.375, 1.55, 1.725, 1.9];
    let mult = activityMultiplier(profile.activityHrsPerWeek);
    if (restDay) { const idx = Math.max(0, tiers.indexOf(mult) - 1); mult = tiers[idx]; }
    return computeBMR(profile, weightKg) * mult;
  }
  function readDeficitPct() {
    const p = loadJSON(PROGRAM_KEY, null);
    return (p && typeof p.deficitPct === 'number') ? p.deficitPct : 20;
  }

  // Same protein/fat/carb split as Alimentation's computeTargets() — kcal
  // alone isn't the target, it's protein first (2.2 g/kg), fat floored for
  // hormonal health, carbs take the rest. A day's calories were never a
  // single arbitrary number, so neither is this.
  function macrosForKcal(weightKg, targetKcal) {
    const proteinG = Math.round(weightKg * 2.2);
    const proteinKcal = proteinG * 4;
    const fatKcal = Math.max(targetKcal * 0.25, weightKg * 0.6 * 9);
    const fatG = Math.round(fatKcal / 9);
    const carbsKcal = Math.max(0, targetKcal - proteinKcal - fatG * 9);
    const carbsG = Math.round(carbsKcal / 4);
    return { proteinG, fatG, carbsG };
  }
  function dayKcalTargets() {
    const profile = readProfile();
    const weightKg = readLiveWeightKg() || profile.weightKg || 75;
    const deficitPct = readDeficitPct();
    const trainKcal = Math.round(computeTDEE(profile, weightKg, false) * (1 - deficitPct/100));
    const restKcal = Math.round(computeTDEE(profile, weightKg, true) * (1 - deficitPct/100));
    return {
      train: Object.assign({ kcal: trainKcal }, macrosForKcal(weightKg, trainKcal)),
      rest: Object.assign({ kcal: restKcal }, macrosForKcal(weightKg, restKcal))
    };
  }

  // ================================================================
  // RENDER
  // ================================================================
  const MONTH_NAMES = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const WEEKDAY_LABELS = ['L','M','M','J','V','S','D'];
  const REST_DEFAULT_LABEL = 'Repos';
  const CROSS_NAV =
    '<div class="cross-nav">' +
    '<a href="gym.html">💪 Fitness</a>' +
    '<a href="seance.html">🏋️ Séance</a>' +
    '<a href="alimentation.html">🍎 Alimentation</a>' +
    '</div>';

  let monthOffset = 0;

  function render() {
    const app = document.getElementById('app');
    const gym = loadJSON(GYM_KEY, {});
    const overrides = loadJSON(OVERRIDES_KEY, {});
    const kcal = dayKcalTargets();
    const now = new Date();
    const todayKey = dateKey(now);
    const base = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
    const y = base.getFullYear(), m = base.getMonth();
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const firstWeekday = (new Date(y, m, 1).getDay() + 6) % 7; // Monday-first

    let html = '<h1 class="dash-title">Calendrier</h1>' +
      '<p class="dash-sub">Un jour non placé compte comme repos par défaut, kcal adaptée en conséquence — touche un jour (passé ou futur, n\'importe quel mois) pour dire qu\'il s\'agit d\'un entraînement à la place.</p>' +
      '<details class="info"><summary>D\'où viennent ces chiffres</summary>' +
      '<p>Le type de jour vient de ce que tu places toi-même ici (touche un jour) — rien n\'est deviné à partir de la répartition automatique de <strong>Fitness</strong>, même si tu l\'as configurée là-bas. Sans placement, un jour compte simplement comme repos (l\'hypothèse la plus sûre), pas comme un entraînement précis inventé.</p>' +
      '<p>Les calories utilisent la même formule que <strong>Alimentation</strong> : <strong>Mifflin-St Jeor (1990)</strong> pour le métabolisme de base, un facteur d\'activité selon tes heures d\'entraînement/semaine, et un cran d\'activité en moins les jours de repos (même logique de "carb cycling" qu\'Alimentation). Le déficit actuel de ton programme adaptatif est appliqué tel quel.</p>' +
      '<p>Ces chiffres sont une <strong>référence figée pour le mois</strong>, pas recalculée jour par jour sur ton poids réel de ce jour précis — pour le chiffre du jour exact, ajusté à ton poids et ton statut repos/entraînement d\'aujourd\'hui, c\'est toujours <strong>Alimentation</strong> qui fait foi. Un jour placé manuellement ici compte aussi pour Alimentation (et la pastille kcal en haut de chaque page), pas seulement pour cette page.</p>' +
      '</details>';

    // month grid
    html += '<div class="gm-card"><div class="cal-head">' +
      '<button type="button" class="cal-nav-btn" id="calPrev" aria-label="Mois précédent">‹</button>' +
      '<span class="cal-month">' + MONTH_NAMES[m] + ' ' + y + '</span>' +
      '<button type="button" class="cal-nav-btn" id="calNext" aria-label="Mois suivant">›</button>' +
      '</div>' +
      '<div class="cal-weekdays">' + WEEKDAY_LABELS.map(d => '<div class="cal-weekday">' + d + '</div>').join('') + '</div>' +
      '<div class="cal-grid">';
    for (let i = 0; i < firstWeekday; i++) html += '<div></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(y, m, d);
      const dk = dateKey(date);
      // A day you placed shows exactly that. An untouched day defaults to
      // Repos (not a guessed training type) so it always has a sensible
      // kcal target — but that default never gets pushed to the phone
      // feed, which stays strictly "only what you actually placed".
      const isManual = !!overrides[dk];
      const split = overrides[dk] || REST_DEFAULT_LABEL;
      const rest = isRestLabel(split);
      const isToday = dk === todayKey;
      const cls = 'cal-cell' + (isToday ? ' today' : '') + (isManual ? ' manual' : '') + (rest ? ' rest' : ' train');
      const dayTarget = rest ? kcal.rest : kcal.train;
      html += '<button type="button" class="' + cls + '" data-date="' + dk + '" title="' + escapeHtml(split) + (isManual ? ' (placé par toi)' : ' (par défaut — touche pour changer)') + ' · ' + dayTarget.kcal + ' kcal (P' + dayTarget.proteinG + ' G' + dayTarget.carbsG + ' L' + dayTarget.fatG + ')' + '">' +
        '<span class="cal-day">' + d + '</span>' +
        '<span class="cal-split">' + escapeHtml(split) + '</span>' +
        '<span class="cal-kcal">' + dayTarget.kcal + '</span>' +
        '</button>';
    }
    html += '</div>' +
      '<div class="cal-legend">' +
      '<span class="cal-legend-item"><span class="cal-legend-dot train"></span>Entraînement · ~' + kcal.train.kcal + ' kcal · P' + kcal.train.proteinG + ' G' + kcal.train.carbsG + ' L' + kcal.train.fatG + '</span>' +
      '<span class="cal-legend-item"><span class="cal-legend-dot rest"></span>Repos · ~' + kcal.rest.kcal + ' kcal · P' + kcal.rest.proteinG + ' G' + kcal.rest.carbsG + ' L' + kcal.rest.fatG + '</span>' +
      '</div><div class="program-note">Un jour non placé compte comme repos par défaut (kcal et macros adaptées) — touche-le pour dire qu\'il s\'agit d\'un jour d\'entraînement. Mêmes chiffres que dans Alimentation (protéines 2.2g/kg, lipides plancher 25%, glucides le reste) — pas deux calculs différents. Seuls les jours que tu places réellement apparaissent dans l\'abonnement téléphone.</div></div>';

    // today summary — placed day if there is one, Repos by default otherwise
    const todayManual = !!overrides[todayKey];
    const todaySplit = overrides[todayKey] || REST_DEFAULT_LABEL;
    const todayRest = isRestLabel(todaySplit);
    const todayTarget = todayRest ? kcal.rest : kcal.train;
    html += '<div class="gm-card"><div class="section-title">Aujourd\'hui</div>' +
      '<div class="today-row">' +
      '<div class="today-badge">' + (todayRest ? '😴' : '💪') + '</div>' +
      '<div class="today-info">' +
      '<div class="today-split">' + escapeHtml(todaySplit) + (todayManual ? '' : ' <span style="color:var(--text-tertiary);font-size:12px;font-weight:600;">(par défaut)</span>') + '</div>' +
      '<div class="today-kcal">Vise ~' + todayTarget.kcal + ' kcal aujourd\'hui</div>' +
      '</div></div>' +
      '<div class="program-row"><span>Protéines</span><span>' + todayTarget.proteinG + ' g</span></div>' +
      '<div class="program-row"><span>Glucides</span><span>' + todayTarget.carbsG + ' g</span></div>' +
      '<div class="program-row"><span>Lipides</span><span>' + todayTarget.fatG + ' g</span></div>' +
      '<div class="today-links">' +
      '<a class="today-link" href="seance.html">Lancer la séance →</a>' +
      '<a class="today-link" href="alimentation.html">Voir Alimentation →</a>' +
      '</div></div>';

    // calendar subscription (ICS feed, server-side, see /api/calendar.ics.js)
    const icsUrl = window.location.origin + '/api/calendar.ics';
    html += '<div class="gm-card"><div class="section-title">Abonnement calendrier téléphone</div>' +
      '<div class="sub-row"><span class="sub-url" id="icsUrl">' + escapeHtml(icsUrl) + '</span>' +
      '<button type="button" class="sub-copy" id="icsCopyBtn">Copier</button></div>' +
      '<div class="sub-steps"><b>iPhone (Apple Calendrier)</b>' +
      '<ol><li>Réglages → Calendrier → Comptes → Ajouter un compte</li><li>Autre → Ajouter un abonnement calendrier</li><li>Colle le lien ci-dessus</li></ol></div>' +
      '<div class="sub-steps"><b>Android / Google Agenda</b>' +
      '<ol><li>calendar.google.com sur un ordinateur (pas possible depuis l\'appli mobile)</li><li>Autres agendas → + → À partir de l\'URL</li><li>Colle le lien ci-dessus — il apparaît ensuite aussi dans l\'appli Google Agenda du téléphone</li></ol></div>' +
      '<div class="program-note">Un jour par événement (toute la journée) : le type de séance et la cible de calories. L\'appli calendrier gère son propre rythme de rafraîchissement (souvent toutes les quelques heures, pas instantané) — ce lien ne pousse rien tout seul, il est juste interrogé périodiquement.</div>' +
      '</div>';

    html += CROSS_NAV;
    html += '<div class="modal-bg" id="dayModalBg"><div class="modal" id="dayModalInner"></div></div>';
    app.innerHTML = html;

    document.getElementById('calPrev').addEventListener('click', () => { monthOffset--; render(); });
    document.getElementById('calNext').addEventListener('click', () => { monthOffset++; render(); });
    app.querySelectorAll('.cal-cell[data-date]').forEach(btn => {
      btn.addEventListener('click', () => openDayModal(btn.dataset.date, gym, overrides));
    });
    const dayModalBg = document.getElementById('dayModalBg');
    dayModalBg.addEventListener('click', (e) => { if (e.target === dayModalBg) closeDayModal(); });

    const copyBtn = document.getElementById('icsCopyBtn');
    if (copyBtn) copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(icsUrl);
        copyBtn.textContent = 'Copié ✓';
        copyBtn.classList.add('done');
        setTimeout(() => { copyBtn.textContent = 'Copier'; copyBtn.classList.remove('done'); }, 2000);
      } catch (e) {
        alert('Copie impossible automatiquement — sélectionne le lien manuellement :\n' + icsUrl);
      }
    });
  }

  // ================================================================
  // DAY PICKER — assign (or clear) a manual split for one date. Options
  // are whatever's actually in your Fitness rotation (deduped), so this
  // never invents or translates a label of its own.
  // ================================================================
  function setOverride(dk, label) {
    const overrides = loadJSON(OVERRIDES_KEY, {});
    if (label) overrides[dk] = label; else delete overrides[dk];
    saveJSON(OVERRIDES_KEY, overrides);
  }
  function closeDayModal() {
    const bg = document.getElementById('dayModalBg');
    if (bg) bg.classList.remove('show');
  }
  function openDayModal(dk, gym, overrides) {
    const bg = document.getElementById('dayModalBg');
    const inner = document.getElementById('dayModalInner');
    if (!bg || !inner) return;
    // Pulled from state.days — the actual "séances" list you manage in
    // Fitness (Réglages → Mes séances, e.g. Upper/Lower or Push/Pull/Legs,
    // whatever you've actually named them there), not splitRotation, which
    // is a separate, independently-edited schedule that can drift out of
    // sync with what your séances are actually called.
    const dayNames = ((gym.days || []).map(d => (d && d.name || '').trim()).filter(Boolean));
    const labels = Array.from(new Set(dayNames.concat([REST_DEFAULT_LABEL])));
    const current = overrides[dk];
    const [yy, mm, dd] = dk.split('-').map(Number);
    const dateLabel = new Date(yy, mm-1, dd).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    inner.innerHTML = '<h3>' + escapeHtml(dateLabel) + '</h3>' +
      (labels.length ?
        '<div class="day-pick-row">' + labels.map(l =>
          '<button type="button" class="day-pick-btn' + (current === l ? ' current' : '') + '" data-l="' + escapeHtml(l) + '">' + escapeHtml(l) + '</button>'
        ).join('') + '</div>' :
        '<p class="empty-note">Crée tes séances dans Fitness d\'abord (Réglages → Mes séances) pour pouvoir choisir un type de jour ici.</p>') +
      '<div class="modal-actions">' +
      (current ? '<button type="button" class="btn-secondary" id="dayReset">Réinitialiser (auto)</button>' : '') +
      '<button type="button" class="btn-secondary" id="dayCancel">Fermer</button>' +
      '</div>';
    inner.querySelectorAll('[data-l]').forEach(btn => {
      btn.addEventListener('click', () => { setOverride(dk, btn.dataset.l); closeDayModal(); render(); });
    });
    const resetBtn = document.getElementById('dayReset');
    if (resetBtn) resetBtn.addEventListener('click', () => { setOverride(dk, null); closeDayModal(); render(); });
    document.getElementById('dayCancel').addEventListener('click', closeDayModal);
    bg.classList.add('show');
  }

  await pcPullOnce();
  render();
})();
</script>
<script id="atmo-backdrop-js">
(function () {
  function spawnParticles() {
    var root = document.getElementById('atmoParticles');
    if (!root) return;
    root.innerHTML = '';
    var N = window.innerWidth < 640 ? 12 : 20;
    for (var i = 0; i < N; i++) {
      var s = document.createElement('span');
      s.style.left = (Math.random() * 100) + '%';
      s.style.top = (55 + Math.random() * 45) + '%';
      var size = 1.1 + Math.random() * 1.2;
      s.style.width = s.style.height = size + 'px';
      var dur = 24 + Math.random() * 30;
      s.style.animationDuration = dur + 's';
      s.style.animationDelay = (-Math.random() * dur) + 's';
      s.style.setProperty('--dx', (Math.random() * 28 - 14) + 'px');
      s.style.setProperty('--dy', -(55 + Math.random() * 45) + 'vh');
      root.appendChild(s);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', spawnParticles);
  else spawnParticles();
})();
</script>
</body>
</html>
