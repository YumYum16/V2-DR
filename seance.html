<style>
:root {
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --success: #6BE3A4;
  --warning: #F2C063;
  --danger:  #FF6B6B;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: #050506; color: var(--text-secondary);
  font-family: var(--font); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh; position: relative; overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(255, 107, 107, 0.14), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(180, 180, 200, 0.06), transparent 50%);
  filter: blur(40px); pointer-events: none; z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px; pointer-events: none; z-index: -1;
}
@keyframes drift {
  0%   { transform: translate3d(0,0,0); }
  100% { transform: translate3d(-22px, 14px, 0); }
}
/* ===== Fond atmosphérique "Effort" (rouge + particules), même système
   que les autres pages du tableau de bord ===== */
.atmo-wash {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(60% 50% at 50% 20%, rgba(255,107,107,0.15) 0%, rgba(255,107,107,0.05) 35%, transparent 65%),
    radial-gradient(50% 40% at 80% 85%, rgba(180,40,40,0.12) 0%, transparent 60%),
    radial-gradient(120% 80% at 50% 100%, rgba(24,8,8,0.5) 0%, rgba(4,6,10,0.95) 75%);
  background-repeat: no-repeat; background-size: 100% 100%;
}
.atmo-particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.atmo-particles span {
  position: absolute; width: 1.5px; height: 1.5px; border-radius: 50%;
  background: rgba(255,190,190,0.7);
  animation: atmo-drift linear infinite;
  box-shadow: 0 0 6px rgba(255,107,107,0.55);
}
@keyframes atmo-drift {
  0%   { transform: translate3d(0, 0, 0); opacity: 0; }
  10%  { opacity: 0.7; }
  90%  { opacity: 0.5; }
  100% { transform: translate3d(var(--dx, 12px), var(--dy, -100vh), 0); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .atmo-particles span { animation: none; } }
.hidden { display: none !important; }
.page { max-width: 720px; margin: 0 auto; position: relative; z-index: 5; }
.dash-title {
  margin: 0 0 4px; font-size: 28px; font-weight: 700; letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.dash-sub { margin: 0 0 20px; font-size: 13px; color: var(--text-tertiary); }
.gm-card {
  position: relative; background: rgba(255, 255, 255, 0.04); border-radius: 16px;
  padding: 20px; margin-bottom: 14px;
  backdrop-filter: blur(24px) saturate(1.2); -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
}
.section-title {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-tertiary); margin-bottom: 12px;
}
.gm-emoji { font-size: 40px; margin-bottom: 10px; text-align: center; }
.gm-card h2 { margin: 0 0 8px; font-size: 17px; color: var(--text-primary); text-align: center; }
.gm-card p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--text-tertiary); text-align: center; }
.gm-ghost {
  display: inline-block; margin-top: 18px;
  padding: 11px 18px; border: 1px solid rgba(255,255,255,0.10); border-radius: 12px;
  background: rgba(255,255,255,0.04); color: var(--text-primary);
  font-family: inherit; font-size: 13px; font-weight: 600; text-decoration: none;
  transition: background 0.15s, border-color 0.15s;
}
.gm-ghost:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.18); }

/* ---- Session history ---- */

.hist-card { padding: 16px; }
.hist-list { display: flex; flex-direction: column; gap: 8px; }

.hist-score.good { color: var(--success); background: rgba(107,227,164,0.14); }

.field-col { flex: 1 1 140px; display: flex; flex-direction: column; gap: 6px; }

.cardio-card { padding: 16px; }
.cardio-result { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(107,227,164,0.06); border: 1px solid rgba(107,227,164,0.16); font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; }
.cardio-hist-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid rgba(255,255,255,0.06); font-size: 12.5px; }

.cardio-hist-meta { color: var(--text-tertiary); font-size: 11.5px; margin-top: 2px; }

.ex-form-card { padding: 16px; }
.ex-form-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }

.ex-target-note {

  padding: 8px 10px; border-radius: 10px; background: rgba(107,227,164,0.06);
  border: 1px solid rgba(107,227,164,0.16);
}
.set-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.set-idx {
  width: 22px; flex-shrink: 0; text-align: center; font-family: var(--font-mono);
  font-size: 12px; color: var(--text-tertiary);
}
.set-row input {
  flex: 1 1 0; min-width: 0; padding: 9px 10px; border-radius: 9px;
  border: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.28);
  color: var(--text-primary); font-family: inherit; font-size: 13.5px;
}
.set-fail-btn {
  flex-shrink: 0; padding: 8px 10px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.04); color: var(--text-tertiary);
  font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
}
.set-fail-btn.active { background: rgba(255,107,107,0.16); color: var(--danger); border-color: rgba(255,107,107,0.4); }
.set-del-btn {
  flex-shrink: 0; width: 28px; height: 28px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.04); color: var(--text-tertiary); cursor: pointer; font-size: 15px; line-height: 1;
}
.add-set-btn {
  margin-top: 2px; padding: 8px 14px; border-radius: 999px; border: 1px dashed rgba(255,255,255,0.16);
  background: transparent; color: var(--text-secondary); font-family: inherit; font-size: 12.5px;
  font-weight: 600; cursor: pointer;
}
.add-set-btn:hover { border-color: rgba(255,255,255,0.32); color: var(--text-primary); }
.gm-add {
  width: 100%; padding: 13px 20px; border: 0; border-radius: 12px; margin-top: 6px;
  background: linear-gradient(180deg, #FFFFFF 0%, #E8E5DD 100%); color: #0A0A0B;
  font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 2px 8px rgba(0,0,0,0.35), 0 8px 22px rgba(0,0,0,0.25);
}
.save-flash { text-align: center; font-size: 12.5px; color: var(--success); margin-top: 10px; }

body.seance-live { padding-bottom: max(20px, env(safe-area-inset-bottom)); }
body.seance-live .topbar, body.seance-live .bottombar { display: none !important; }
.live-view { max-width: 460px; margin: 0 auto; }
.live-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }

.live-end-btn {

.live-current { text-align: center; padding: 22px 16px; }
.live-ex-img { width: 84px; height: 84px; border-radius: 16px; object-fit: cover; margin: 0 auto 12px; display: block; }

.live-ex-name { font-size: 19px; font-weight: 700; color: var(--text-primary); margin: 0 0 4px; }
.live-set-label { font-size: 12.5px; color: var(--text-tertiary); }
.live-target-note {

.timer-card { text-align: center; }

}

}
.live-set-form { display: flex; flex-direction: column; gap: 10px; }
.live-input-row { display: flex; gap: 10px; }
.live-input-col { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.live-input-col label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary);
}
.live-input-col input {

<script>
(async function(){
  'use strict';

  const LS_KEY = 'po_coach_v1';
  const IS_MOBILE = window.matchMedia('(max-width: 720px)').matches;

  // ================================================================
  // CLOUD SYNC — same Supabase row Fitness (gym.html) already syncs
  // (appKey "po-coach"), so a session logged here shows up there and on
  // any other device, and vice versa. Pulled once before this page reads
  // its own state (below); pushed after every successful local save.
  // ================================================================
  const PC_APP_KEY = 'po-coach';
  const PC_SUPABASE_URL = window.DASH_SUPABASE_URL || 'https://srajryooffirbroltjmg.supabase.co';
  const PC_SUPABASE_KEY = window.DASH_SUPABASE_KEY || 'sb_publishable_5142ZwTLF_DkSVRzciNuRA_bHwRAu4c';
  const PC_SYNCED_KEYS = ['po_coach_v1', 'po_coach_workout_done', 'po_coach_weights', 'po_coach_photos', 'po_motivation_v1', 'po_day_overrides_v1'];
  // Marks "the last push to the cloud didn't confirm" (offline, request
  // failed, etc). Never itself synced — purely a local flag. Without this,
  // a save made while offline would sit correctly in localStorage but
  // never reach the cloud, and the NEXT load's pcPullOnce() would blindly
  // overwrite localStorage with the (now stale) cloud copy — silently
  // erasing the offline write on this same device. See pcPullOnce().
  const PC_PENDING_KEY = 'po_coach_pc_pending_v1';

  }
  async function pcPullOnce() {
    if (!pcSupa) return;
    // Retry any push that failed to confirm before pulling — otherwise
    // this pull would overwrite the newer local data (from that failed
    // push) with the older cloud copy it never reached.
    if (localStorage.getItem(PC_PENDING_KEY)) {
      await pcPushNow();
      if (localStorage.getItem(PC_PENDING_KEY)) return; // still failing (offline?) — don't pull stale data over newer local data
    }
    try {
      // Never let a slow/dead connection block this page from opening —
      // it works local-only same as before if the pull doesn't land in time.
      const result = await Promise.race([
        pcSupa.from('app_state').select('data').eq('key', PC_APP_KEY).maybeSingle(),
        new Promise((resolve) => setTimeout(() => resolve(null), 4000))
      ]);
      if (!result) return;
      const { data, error } = result;
      if (!error && data && data.data) {
        Object.keys(data.data).forEach(k => {
          if (PC_SYNCED_KEYS.indexOf(k) === -1) return;
          try { localStorage.setItem(k, JSON.stringify(data.data[k])); } catch (e) {}
        });
      }
    } catch (e) {}
  }
  async function pcPushNow() {
    if (!pcSupa) return;

      const v = localStorage.getItem(k);
      if (v == null) return;
      try { out[k] = JSON.parse(v); } catch (e) { out[k] = v; }
    });
    try {
      const { error } = await pcSupa.from('app_state').upsert(
        { key: PC_APP_KEY, data: out, updated_at: new Date().toISOString() }, { onConflict: 'key' }
      );
      if (error) throw error;
      try { localStorage.removeItem(PC_PENDING_KEY); } catch (e) {}

  function loadGym(){

  // Merges this page's new log entries into whatever is CURRENTLY in
  // localStorage, instead of overwriting the whole blob with the

  // tab (Fitness open elsewhere, or another Séance session) saving
  // afterward would silently wipe out a session that was already
  // recorded — exactly the "it disappeared" bug this fixes.
  // Entries logged before this feature existed have no .id, so dedupe
  // falls back to a content signature for those.
  function logKey(l){ return l.id || [l.date, l.time, l.weight, l.reps, l.dayId].join('|'); }
  function saveGym(state){
    try {

        const freshList = fresh.logs[exId] || [];
        const freshKeys = new Set(freshList.map(logKey));
        const toAdd = (state.logs[exId] || []).filter(l => !freshKeys.has(logKey(l)));
        fresh.logs[exId] = freshList.concat(toAdd);
      });

      pcPushNow(); // fire-and-forget — don't block the UI on the network

  // Session duration — captured automatically (exact) by the live flow's

  }
  function fmtRestSec(sec) {

  }
  function todayStr(){

  function escapeHtml(s){

  function uid(){ return 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }

  // ================================================================
  // NEXT-TARGET SUGGESTION — same "double progression" scheme as Fitness
  // (see gym.html): work a rep range, and once EVERY working set (every
  // set logged at the heaviest weight used that day — lighter warm-ups
  // are excluded automatically) reaches the top of it, add load and drop
  // back to the bottom. A single strong first set doesn't trigger
  // progression on its own; the weakest set that day is the real
  // bottleneck. 6-10 is a practical anchor, not a hard rule — hypertrophy
  // occurs across a wide rep spectrum (roughly 5-30) as long as sets are
  // close to failure (Schoenfeld et al.'s load-comparison meta-analyses;
  // Refalo et al. 2021's re-examination of the "repetition continuum").
  //
  // The underlying principle — always give the body a slightly bigger
  // stimulus than last time, never the same one — is progressive
  // overload, dating back to DeLorme & Watkins' (1948) founding work on
  // progressive resistance exercise and formalized as the core driver of
  // continued strength/hypertrophy adaptation in the ACSM's position
  // stand on progression models in resistance training (Kraemer &
  // Ratamess, 2004). The double-progression scheme (reps up before
  // weight up) is the standard way strength & conditioning coaching
  // applies it in practice (NSCA's Essentials of Strength Training and
  // Conditioning, Baechle & Earle, eds.) — which is why the target below
  // is always phrased as "beat the last session by at least one rep",
  // not just a static number.
  // ================================================================
  const HYPERTROPHY_REP_LOW = 6, HYPERTROPHY_REP_HIGH = 10;
  function suggestNextTarget(state, ex){
    const logs = (state.logs && state.logs[ex.id]) || [];
    const last = lastLogFor(state, ex.id);
    if (!last) return null;
    const sameDay = logs.filter(l => l.date === last.date);
    const maxWeight = Math.max.apply(null, sameDay.map(l => l.weight || 0));
    const workingSets = sameDay.filter(l => (l.weight || 0) === maxWeight);
    const minReps = Math.min.apply(null, workingSets.map(l => l.reps || 0));
    const anyFailed = workingSets.some(l => l.failed);
    const allAtTarget = !anyFailed && workingSets.every(l => (l.reps || 0) >= HYPERTROPHY_REP_HIGH);
    const step = ex.fixedWeight ? 2 : 2.5;
    let weight = maxWeight, reps, note;
    if (allAtTarget) {
      if (ex.bodyweight) {
        reps = HYPERTROPHY_REP_LOW;
        note = 'Toutes les séries à ' + HYPERTROPHY_REP_HIGH + '+ reps — envisage d\'ajouter du lest.';
      } else {
        weight = Math.round((weight + step) * 10) / 10;
        reps = HYPERTROPHY_REP_LOW;
        note = 'Toutes les séries ont battu ' + HYPERTROPHY_REP_HIGH + ' reps — charge augmentée (+' + step + (state.units || 'kg') + ') pour continuer à progresser.';
      }
    } else {
      // Floor the target on the best "weakest working set" seen across the
      // last few sessions at this weight, not just the very last one — a
      // single rough session (poor sleep, off day) shouldn't force the
      // target back down when recent sessions already proved a higher rep
      // count. Progressive overload trends upward session over session;
      // one data point is too noisy to reset that trend on its own.
      const recentDates = Array.from(new Set(logs.filter(l => (l.weight || 0) === maxWeight).map(l => l.date))).sort().reverse().slice(0, 3);
      let recentBestMin = minReps;
      recentDates.forEach(d => {
        const daySets = logs.filter(l => l.date === d && (l.weight || 0) === maxWeight);
        const dayMin = Math.min.apply(null, daySets.map(l => l.reps || 0));
        if (dayMin > recentBestMin) recentBestMin = dayMin;
      });
      if (anyFailed) {
        reps = Math.max(minReps, recentBestMin);
        note = 'Échec sur au moins une série — reste sur cette charge, revise ' + reps + ' reps sur toutes les séries.';
      } else {
        reps = Math.min(HYPERTROPHY_REP_HIGH, recentBestMin + 1);
        note = 'Bats ta dernière séance : ' + reps + ' reps sur TOUTES les séries — au moins 1 de plus que ta meilleure série récente (' + recentBestMin + '), avant d\'augmenter la charge.';
      }
    }
    return { weight, reps, note };
  }

  // ================================================================
  // SESSION HISTORY — logs are stored per exercise, so a "session" is
  // reconstructed by grouping every set that shares the same date +
  // dayId. The per-session grade is a transparent rubric (not a black
  // box): how much of the séance's planned exercises got done, whether
  // the failure rate sits in a healthy training-intensity range, and
  // whether volume was in line with what that séance normally calls
  // for — each shown separately in the critique text, not just a bare
  // number.
  // ================================================================
  function plannedExercisesForDay(state, dayId){
    return (state.exercises || []).filter(e => Array.isArray(e.days) && e.days.includes(dayId));
  }
  function buildSessionsHistory(state){
    const map = {};
    (state.exercises || []).forEach(ex => {
      ((state.logs && state.logs[ex.id]) || []).forEach(l => {
        if (!l.dayId || !l.date) return; // older/manual entries without a séance context are skipped
        const key = l.date + '|' + l.dayId;
        const s = map[key] = map[key] || { date: l.date, dayId: l.dayId, lastTime: '', sets: [] };
        s.sets.push({ exId: ex.id, exName: ex.name, weight: l.weight || 0, reps: l.reps || 0, failed: !!l.failed, restSec: l.restSec, side: l.side, rir: (l.rir != null ? l.rir : null) });
        if (l.time && l.time > s.lastTime) s.lastTime = l.time;
      });
    });
    const meta = state.sessionMeta || {};
    Object.keys(map).forEach(key => { map[key].durationMin = (meta[key] && meta[key].durationMin) || null; });
    return Object.values(map).sort((a, b) => b.date === a.date ? b.lastTime.localeCompare(a.lastTime) : b.date.localeCompare(a.date));
  }
  function analyzeSession(state, session){
    const planned = plannedExercisesForDay(state, session.dayId);
    const doneIds = new Set(session.sets.map(s => s.exId));
    const missing = planned.filter(e => !doneIds.has(e.id));
    const totalSets = session.sets.length;
    const failedSets = session.sets.filter(s => s.failed).length;
    const failRate = totalSets ? failedSets / totalSets : 0;
    const tonnage = session.sets.reduce((sum, s) => sum + s.weight * s.reps, 0);

    const completionScore = planned.length ? Math.min(1, doneIds.size / planned.length) : (doneIds.size ? 1 : 0);
    // RIR (reps in reserve) is the real proximity-to-failure signal when
    // it's been logged — a set can hit "échec" (missed a rep) or not, but
    // RIR tells you how close every OTHER set got, which échec alone can't.
    // Target window ~0.5-2.5 RIR average: enough sets pushed close to
    // failure to drive adaptation without grinding everything to 0 RIR
    // every time (RIR-based programming, e.g. Helms, Zourdos et al.) —
    // too high suggests unused margin, too low suggests overreaching for
    // a single session. Falls back to the cruder échec rate when a
    // session has no RIR logged at all (older entries, or the desktop
    // form used without filling it in).
    const ratedSets = session.sets.filter(s => s.rir != null);
    const avgRir = ratedSets.length ? ratedSets.reduce((sum, s) => sum + s.rir, 0) / ratedSets.length : null;
    let intensityScore;
    if (avgRir != null) {
      if (avgRir >= 0.5 && avgRir <= 2.5) intensityScore = 1;
      else if (avgRir < 0.5) intensityScore = Math.max(0, 1 - (0.5 - avgRir) / 0.5);
      else intensityScore = Math.max(0, 1 - (avgRir - 2.5) / 3);
    } else if (totalSets) {
      if (failRate >= 0.10 && failRate <= 0.30) intensityScore = 1;
      else if (failRate < 0.10) intensityScore = 0.6 + (failRate / 0.10) * 0.4;
      else intensityScore = Math.max(0, 1 - (failRate - 0.30) / 0.5);
    } else intensityScore = 0;
    // Volume relative to this séance's own exercise count (~3 sets/exercise
    // baseline, in line with the 10-20 sets/muscle/week hypertrophy range
    // — Schoenfeld/Grgic — spread across a handful of exercises).
    const volumeScore = planned.length ? Math.min(1, totalSets / (planned.length * 3)) : Math.min(1, totalSets / 6);

    const score = Math.round((completionScore * 0.4 + intensityScore * 0.3 + volumeScore * 0.3) * 100) / 10;

    const critique = [];
    if (missing.length) critique.push('Pas fait : ' + missing.map(e => e.name).join(', ') + '.');
    if (avgRir != null) {
      if (avgRir < 0.5) critique.push('RIR moyen très bas (' + avgRir.toFixed(1) + ') — beaucoup de séries proches de l\'échec, la fatigue générée était sans doute élevée.');
      else if (avgRir > 2.5) critique.push('RIR moyen élevé (' + avgRir.toFixed(1) + ') — de la marge est probablement restée sur la table, tu peux sans doute pousser un peu plus la prochaine fois.');
    } else if (failRate > 0.30) critique.push('Taux d\'échec élevé (' + Math.round(failRate * 100) + '%) — la charge était sans doute trop lourde pour cette séance.');
    else if (failRate === 0 && totalSets >= 4) critique.push('Aucune série à l\'échec — tu as sans doute de la marge, essaie d\'augmenter la charge la prochaine fois.');
    if (volumeScore < 0.6) critique.push('Volume un peu faible par rapport aux exercices prévus pour cette séance.');
    if (!critique.length) critique.push('Séance complète et équilibrée.');

    return { planned, missing, totalSets, failedSets, failRate, avgRir, tonnage, score, critique };
  }
  function formatHistDate(dateStr){
    const parts = dateStr.split('-').map(Number);
    const dt = new Date(parts[0], parts[1] - 1, parts[2]);
    const mons = ['jan','fév','mars','avr','mai','juin','juil','août','sep','oct','nov','déc'];
    return dt.getDate() + ' ' + mons[dt.getMonth()];
  }
  // ================================================================
  // CARDIO — logs a cardio session (treadmill walk/run with speed+incline,
  // or MET-based for machines without a grade) and turns it into an
  // actual kcal figure instead of a generic "you did cardio" flag.
  // Stored alongside strength logs in the same po_coach_v1 blob (already
  // synced via PC_SYNCED_KEYS) so Alimentation/Énergie can read it.
  //
  // Treadmill kcal uses ACSM's Metabolic Equations (ACSM's Guidelines for
  // Exercise Testing and Prescription) — the standard formula for
  // walking/running VO2 as a function of speed AND grade, which is the
  // whole reason it's used here instead of a flat MET table: it's the one
  // formula that actually consumes the incline%/speed inputs. Walk vs run
  // is the equations' own validity split (~6.4 km/h / 4mph). Non-treadmill
  // cardio (no grade to speak of) falls back to standard MET values from
  // the Compendium of Physical Activities (Ainsworth et al., 2011).
  // kcal/min = VO2(ml/kg/min) * weight(kg) / 200 — from 1 L O2 ≈ 5 kcal.
  // ================================================================
  const CARDIO_TYPES = [
    { id: 'marche', label: 'Marche (tapis)', mode: 'treadmill', kind: 'walk' },
    { id: 'course', label: 'Course (tapis)', mode: 'treadmill', kind: 'run' },
    { id: 'velo', label: 'Vélo', mode: 'met', met: 7.5 },
    { id: 'elliptique', label: 'Elliptique', mode: 'met', met: 5.0 },

  function readBodyKgForCardio() {
    try {
      const entries = JSON.parse(localStorage.getItem('po_coach_weights'));
      if (Array.isArray(entries) && entries.length) {
        const latest = entries[entries.length - 1];
        const kg = unit === 'lb' ? latest.weight / 2.20462 : latest.weight;
        if (kg > 0) return kg;
      }
    } catch (e) {}
    try {
      const w = JSON.parse(localStorage.getItem('po_water_v1'));
      if (w && w.profile && w.profile.weightKg) {
        const kg = w.weightUnit === 'lb' ? w.profile.weightKg / 2.20462 : w.profile.weightKg;

      }

  }
  function cardioVO2(type, speedKmh, inclinePct) {

    const grade = inclinePct / 100;
    return type.kind === 'run'
      ? 0.2 * speedM + 0.9 * speedM * grade + 3.5

  }
  function computeCardioKcal(typeId, inclinePct, speedKmh, durationMin, weightKg) {

  }
  function loadCardioEntries() {

  }
  function saveCardioEntry(entry) {
    try {

    } catch (e) {

    }
  }
  function deleteCardioEntry(id) {
    try {

  function cardioTypeLabel(id) { const t = CARDIO_TYPES.find(x => x.id === id); return t ? t.label : id; }
  function cardioHistRow(e) {
    const meta = e.mode === 'treadmill'
      ? (e.inclinePct || 0) + '% · ' + e.speedKmh + ' km/h · ' + e.durationMin + ' min'

      '<div style="display:flex;align-items:center;gap:10px;"><strong>' + Math.round(e.kcal) + ' kcal</strong><button type="button" class="cardio-del" data-cardio-del="' + e.id + '" aria-label="Supprimer">×</button></div></div>';
  }
  function renderCardioCard() {
    const recent = loadCardioEntries().slice().sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time)).slice(0, 6);
    const optionsHtml = CARDIO_TYPES.map(t => '<option value="' + t.id + '">' + escapeHtml(t.label) + '</option>').join('');
    return '<div class="gm-card cardio-card"><div class="section-title">Cardio</div>' +
      '<div class="field-row">' +
      '<div class="field-col"><label>Type</label><select id="cardioType">' + optionsHtml + '</select></div>' +
      '<div class="field-col" id="cardioInclineCol"><label>Pente (%)</label><input type="number" id="cardioIncline" step="0.5" min="0" value="0"></div>' +
      '<div class="field-col" id="cardioSpeedCol"><label>Vitesse (km/h)</label><input type="number" id="cardioSpeed" step="0.1" min="0" value="5"></div>' +
      '<div class="field-col"><label>Durée (min)</label><input type="number" id="cardioDuration" step="1" min="0" value="30"></div>' +
      '</div>' +
      '<div class="cardio-result" id="cardioResult"></div>' +

      (recent.length ? '<div style="margin-top:14px;">' + recent.map(cardioHistRow).join('') + '</div>' : '') +

  }
  function wireCardioCard(onChange) {
    const typeEl = document.getElementById('cardioType');
    if (!typeEl) return;
    const inclineCol = document.getElementById('cardioInclineCol'), speedCol = document.getElementById('cardioSpeedCol');
    const inclineEl = document.getElementById('cardioIncline'), speedEl = document.getElementById('cardioSpeed'), durationEl = document.getElementById('cardioDuration');
    const resultEl = document.getElementById('cardioResult');
    function currentType() { return CARDIO_TYPES.find(t => t.id === typeEl.value) || CARDIO_TYPES[0]; }
    function refresh() {
      const t = currentType(), isTread = t.mode === 'treadmill';
      inclineCol.style.display = isTread ? '' : 'none';
      speedCol.style.display = isTread ? '' : 'none';
      const weightKg = readBodyKgForCardio();
      const r = computeCardioKcal(t.id, parseFloat(inclineEl.value) || 0, parseFloat(speedEl.value) || 0, parseFloat(durationEl.value) || 0, weightKg);
      resultEl.textContent = r ? ('≈ ' + Math.round(r.kcal) + ' kcal (VO2 ' + r.vo2.toFixed(1) + ' ml/kg/min pour ' + weightKg.toFixed(0) + ' kg) — formule ACSM ' + (isTread ? '(vitesse + pente)' : '(MET ' + t.met + ')') + '.') : '';
    }
    [typeEl, inclineEl, speedEl, durationEl].forEach(el => el.addEventListener('input', refresh));
    refresh();
    document.getElementById('addCardioBtn').addEventListener('click', () => {
      const t = currentType(), weightKg = readBodyKgForCardio(), durationMin = parseFloat(durationEl.value) || 0;
      if (!durationMin) { alert('Durée requise.'); return; }
      const r = computeCardioKcal(t.id, parseFloat(inclineEl.value) || 0, parseFloat(speedEl.value) || 0, durationMin, weightKg);
      const entry = {
        id: 'cx' + Date.now() + Math.floor(Math.random() * 1000), date: todayStr(), time: nowTimeStr(),
        type: t.id, mode: t.mode,
        inclinePct: t.mode === 'treadmill' ? (parseFloat(inclineEl.value) || 0) : null,
        speedKmh: t.mode === 'treadmill' ? (parseFloat(speedEl.value) || 0) : null,
        durationMin, vo2: r.vo2, kcal: r.kcal
      };
      if (saveCardioEntry(entry) && onChange) onChange();
    });
    app.querySelectorAll('[data-cardio-del]').forEach(btn => {
      btn.addEventListener('click', () => { deleteCardioEntry(btn.dataset.cardioDel); if (onChange) onChange(); });
    });
  }

  function renderHistoryCard(state, unit){
    const sessions = buildSessionsHistory(state).slice(0, 8);
    if (!sessions.length) return '';
    const dayName = id => { const d = (state.days || []).find(x => x.id === id); return d ? d.name : id; };
    let html = '<div class="gm-card hist-card"><div class="section-title">Historique</div><div class="hist-list">';
    sessions.forEach((s, i) => {
      const a = analyzeSession(state, s);
      const scoreCls = a.score >= 7 ? 'good' : (a.score >= 4.5 ? 'mid' : 'low');
      html +=
        '<div class="hist-row" data-hist-idx="' + i + '">' +
          '<div class="hist-row-top">' +
            '<span class="hist-day">' + escapeHtml(dayName(s.dayId)) + '</span>' +
            '<span class="hist-date">' + formatHistDate(s.date) + '</span>' +
            '<span class="hist-score ' + scoreCls + '">' + a.score.toFixed(1) + '</span>' +
          '</div>' +
          '<div class="hist-row-meta">' + a.totalSets + ' série(s) · ' + Math.round(a.tonnage) + ' ' + unit + ' de tonnage · ' + (a.avgRir != null ? 'RIR moyen ' + a.avgRir.toFixed(1) : Math.round(a.failRate * 100) + '% échec') + (s.durationMin ? ' · ' + s.durationMin + ' min' : '') + '</div>' +
          '<div class="hist-detail hidden" id="histDetail-' + i + '">' +
            '<ul class="hist-set-list">' + s.sets.map(x => '<li>' + escapeHtml(x.exName) + (x.side ? ' (' + (x.side === 'G' ? 'gauche' : 'droite') + ')' : '') + ' — ' + x.weight + ' ' + unit + ' × ' + x.reps + (x.rir != null ? ' <span class="hist-rest-tag">RIR ' + x.rir + '</span>' : '') + (x.failed ? ' <span class="hist-fail-tag">échec</span>' : '') + (x.restSec ? ' <span class="hist-rest-tag">repos ' + fmtRestSec(x.restSec) + '</span>' : '') + '</li>').join('') + '</ul>' +
            '<div class="hist-critique">' + a.critique.map(c => '<p>' + escapeHtml(c) + '</p>').join('') + '</div>' +
          '</div>' +
        '</div>';
    });
    html += '</div></div>';
    return html;
  }
  function wireHistoryToggles(){
    document.querySelectorAll('.hist-row').forEach(row => {
      row.addEventListener('click', () => {
        const detail = row.querySelector('.hist-detail');
        if (detail) detail.classList.toggle('hidden');
      });
    });
  }

  const CROSS_NAV =
    '<div class="cross-nav">' +
    '<a href="gym.html">💪 Fitness</a>' +
    '<a href="muscle-tracker.html">🩻 Muscle</a>' +
    '<a href="fatigue.html">🔋 Fatigue</a>' +
    '</div>';

  const app = document.getElementById('app');
  app.innerHTML = '<h1 class="dash-title">Séance</h1><p class="dash-sub">Chargement…</p>';
  await pcPullOnce();

  const state = loadGym();
  const days = (state && Array.isArray(state.days)) ? state.days : [];
  const unit = (state && state.units) || 'kg';

  if (!state || !days.length) {
    app.innerHTML =
      '<h1 class="dash-title">Séance</h1>' +
      '<div class="gm-card"><div class="gm-emoji">🏋️</div>' +
      '<h2>Pas encore de séances</h2>' +
      '<p>Va d\'abord dans Fitness pour créer tes exercices et tes séances (Push / Pull / Legs…), puis reviens ici pour les lancer.</p>' +
      '<div style="text-align:center"><a class="gm-ghost" href="gym.html">→ Aller à Fitness</a></div></div>';
    return;
  }

  if (IS_MOBILE) bootMobile(); else bootDesktop();

  // ================================================================
  // DESKTOP — retroactive form. Fill in a session any time (during,
  // right after, or days later if you forgot) — date/time default to
  // now but stay editable.
  // ================================================================
  function bootDesktop(){
    let chosenDay = null;
    let flashMsg = '';

    render();

    function render(){
      if (!chosenDay) { renderDayPick(); return; }
      renderForm(chosenDay);
    }

    function renderDayPick(){
      const banner = flashMsg ? '<div class="gm-card save-banner">' + escapeHtml(flashMsg) + '</div>' : '';
      flashMsg = '';
      app.innerHTML =
        '<h1 class="dash-title">Séance</h1>' +
        banner +
        renderHistoryCard(state, unit) +
        renderCardioCard() +
        '<p class="dash-sub">Choisis la séance à remplir — aujourd\'hui ou en retard, la date reste modifiable.</p>' +
        '<div class="gm-card"><div class="section-title">Quelle séance ?</div>' +
        '<div class="day-grid">' + days.map(d => '<button type="button" class="day-btn" data-day="' + d.id + '">' + escapeHtml(d.name) + '</button>').join('') + '</div>' +
        '</div>' +
        CROSS_NAV;
      wireHistoryToggles();
      wireCardioCard(renderDayPick);
      app.querySelectorAll('.day-btn').forEach(b => {
        b.addEventListener('click', () => { chosenDay = b.dataset.day; render(); });
      });
    }

    function renderForm(dayId){
      const day = days.find(d => d.id === dayId);
      const exList = exercisesForDay(state, dayId);

      let html =
        '<h1 class="dash-title">Séance</h1>' +
        '<div class="gm-card"><div class="day-chosen-row">' +
        '<span class="day-chosen-name">' + escapeHtml(day ? day.name : '') + '</span>' +
        '<button type="button" class="day-change-link" id="changeDayBtn">Changer</button></div>' +
        '<div class="field-row">' +
        '<div class="field-col"><label>Date</label><input type="date" id="seanceDate" value="' + todayStr() + '"></div>' +
        '<div class="field-col"><label>Début (optionnel)</label><input type="time" id="seanceStartTime" value=""></div>' +
        '<div class="field-col"><label>Fin de séance</label><input type="time" id="seanceTime" value="' + nowTimeStr() + '"></div>' +
        '</div></div>';

      if (!exList.length) {
        html += '<div class="gm-card"><p class="empty-note">Aucun exercice assigné à cette séance pour l\'instant. Ajoute-les depuis Fitness.</p></div>';
      } else {
        exList.forEach(ex => {
          const target = suggestNextTarget(state, ex);
          const prefillWeight = target ? target.weight : '';
          const prefillReps = target ? target.reps : '';
          html +=
            '<div class="gm-card ex-form-card" data-ex-id="' + ex.id + '">' +
            '<div class="ex-form-head">' +
            (ex.image ? '<img class="ex-form-thumb" src="' + ex.image + '" alt="">' : '') +
            '<span class="ex-form-name">' + escapeHtml(ex.name) + '</span>' +
            '</div>' +
            (target ? '<div class="ex-target-note">🎯 ' + target.weight + (state.units || 'kg') + ' × ' + target.reps + ' — ' + escapeHtml(target.note) + '</div>' : '') +
            '<div class="set-rows" id="rows-' + ex.id + '" data-last-weight="' + prefillWeight + '" data-last-reps="' + prefillReps + '"></div>' +
            '<button type="button" class="add-set-btn" data-ex="' + ex.id + '">+ Série</button>' +
            '</div>';
        });
        html += '<button type="button" class="gm-add" id="saveSeanceBtn">Enregistrer la séance</button>';
      }

      app.innerHTML = html;
      document.getElementById('changeDayBtn').addEventListener('click', () => { chosenDay = null; render(); });

      app.querySelectorAll('.add-set-btn').forEach(btn => {
        btn.addEventListener('click', () => addSetRow(btn.dataset.ex));
      });
      exList.forEach(ex => addSetRow(ex.id)); // start each exercise with one row

      const saveBtn = document.getElementById('saveSeanceBtn');
      if (saveBtn) saveBtn.addEventListener('click', saveSession);
    }

    function addSetRow(exId){
      const rows = document.getElementById('rows-' + exId);
      if (!rows) return;
      const idx = rows.children.length + 1;
      const prevRow = rows.lastElementChild;
      const prevWeight = prevRow ? prevRow.querySelector('.set-weight').value : rows.dataset.lastWeight;
      const prevReps = prevRow ? prevRow.querySelector('.set-reps').value : rows.dataset.lastReps;
      const row = document.createElement('div');
      row.className = 'set-row';
      row.innerHTML =
        '<span class="set-idx">' + idx + '</span>' +
        '<input type="number" step="0.1" inputmode="decimal" class="set-weight" placeholder="' + unit + '" value="' + (prevWeight || '') + '">' +
        '<input type="number" inputmode="numeric" class="set-reps" placeholder="reps" value="' + (prevReps || '') + '">' +
        '<input type="number" min="0" inputmode="numeric" class="set-rir" placeholder="RIR" title="Reps en réserve (0 = dernière répétition terminée, pas ratée)">' +
        '<button type="button" class="set-fail-btn">Échec</button>' +
        '<button type="button" class="set-del-btn" aria-label="Supprimer">×</button>';
      row.querySelector('.set-fail-btn').addEventListener('click', (e) => e.currentTarget.classList.toggle('active'));
      row.querySelector('.set-del-btn').addEventListener('click', () => {
        row.remove();
        Array.from(rows.children).forEach((r, i) => { r.querySelector('.set-idx').textContent = i + 1; });
      });
      rows.appendChild(row);
    }

    function saveSession(){
      const date = document.getElementById('seanceDate').value || todayStr();
      const time = document.getElementById('seanceTime').value || nowTimeStr();
      const startTime = document.getElementById('seanceStartTime').value || null;
      // Collect into a scratch object first — only touch the real in-memory
      // state once we know the write actually succeeded, so a failed save
      // can't leave duplicate entries queued up for the next retry.
      const newEntries = {};
      let savedSets = 0;
      app.querySelectorAll('.ex-form-card').forEach(card => {
        const exId = card.dataset.exId;
        newEntries[exId] = [];
        card.querySelectorAll('.set-row').forEach(row => {
          const weight = parseFloat(row.querySelector('.set-weight').value);
          const reps = parseInt(row.querySelector('.set-reps').value, 10);
          if (!reps) return; // skip empty rows
          const rirRaw = row.querySelector('.set-rir').value;
          newEntries[exId].push({
            id: uid(), date, time, dayId: chosenDay,
            weight: isNaN(weight) ? 0 : weight, reps: reps,
            failed: row.querySelector('.set-fail-btn').classList.contains('active'),
            rir: rirRaw === '' ? null : Math.max(0, parseInt(rirRaw, 10) || 0)
          });
          savedSets++;
        });
      });
      if (!savedSets) { flashMsg = 'Aucune série remplie — rien n\'a été enregistré.'; chosenDay = null; render(); return; }

      state.logs = state.logs || {};
      Object.keys(newEntries).forEach(exId => {
        state.logs[exId] = (state.logs[exId] || []).concat(newEntries[exId]);
      });
      if (startTime) {
        const [sh, sm] = startTime.split(':').map(Number), [eh, em] = time.split(':').map(Number);
        const durationMin = (eh * 60 + em) - (sh * 60 + sm);
        if (durationMin > 0) saveSessionDuration(date, chosenDay, durationMin);
      }
      if (!saveGym(state)) {
        // Undo the in-memory push so a retry doesn't double the entries
        // once storage has room again — the form stays exactly as typed.
        Object.keys(newEntries).forEach(exId => {
          const ids = new Set(newEntries[exId].map(e => e.id));
          state.logs[exId] = (state.logs[exId] || []).filter(e => !ids.has(e.id));
        });
        return;
      }
      // Back to the day picker so the filled-in form can't be re-submitted
      // by an accidental second click — a stale form still holding the
      // same numbers was exactly how a duplicate save could happen.
      const dayName = (days.find(d => d.id === chosenDay) || {}).name || '';
      flashMsg = '✓ ' + savedSets + ' série(s) enregistrée(s) pour ' + dayName + '.';
      chosenDay = null;
      render();
    }
  }

  // ================================================================
  // MOBILE — live, first-person flow: pick séance → pick exercise →
  // guided workout screen with rest timer, quick set entry, and a
  // queue of the séance's other exercises to jump between.
  // ================================================================
  function bootMobile(){
    let chosenDay = null;
    let queue = [];       // exercises for the chosen day, in order
    let currentIdx = 0;
    const setCounts = {}; // exId -> next set number this session
    // Computed once per exercise the first time it comes up live, from
    // whatever was logged BEFORE this session started — otherwise a set
    // validated a minute ago would count as "last session" for the next
    // set and nudge the weight up mid-workout, which isn't the intent.
    const targetCache = {};
    let wakeLock = null;

    renderDayPick();

    function renderDayPick(){
      app.innerHTML =
        '<h1 class="dash-title">Séance</h1>' +
        renderHistoryCard(state, unit) +
        renderCardioCard() +
        '<p class="dash-sub">Quelle séance veux-tu lancer ?</p>' +
        '<div class="day-grid" style="flex-direction:column">' +
        days.map(d => '<button type="button" class="day-btn" data-day="' + d.id + '" style="padding:18px;">' + escapeHtml(d.name) + '</button>').join('') +
        '</div>' +
        CROSS_NAV;
      wireHistoryToggles();
      wireCardioCard(renderDayPick);
      app.querySelectorAll('.day-btn').forEach(b => {
        b.addEventListener('click', () => { chosenDay = b.dataset.day; startExercisePick(); });
      });
    }

    function startExercisePick(){
      queue = exercisesForDay(state, chosenDay);
      if (!queue.length) {
        app.innerHTML =
          '<h1 class="dash-title">Séance</h1>' +
          '<div class="gm-card"><p class="empty-note">Aucun exercice assigné à cette séance. Ajoute-les depuis Fitness.</p>' +
          '<div style="text-align:center"><a class="gm-ghost" href="gym.html">→ Aller à Fitness</a></div></div>';
        return;
      }
      renderExercisePick();
    }

    function renderExercisePick(){
      app.innerHTML =
        '<h1 class="dash-title">Séance</h1>' +
        '<p class="dash-sub">Quel exercice fais-tu maintenant ?</p>' +
        '<div class="pick-list">' +
        queue.map((ex, i) =>
          '<div class="pick-item" data-idx="' + i + '">' +
          (ex.image ? '<img class="pick-thumb" src="' + ex.image + '" alt="">' : '<div class="pick-thumb"></div>') +
          '<span class="pick-name">' + escapeHtml(ex.name) + '</span>' +
          '<span class="pick-arrow">→</span></div>'
        ).join('') +
        '</div>';
      app.querySelectorAll('.pick-item').forEach(el => {
        el.addEventListener('click', () => { currentIdx = parseInt(el.dataset.idx, 10); startLive(); });
      });
    }

    // Suggested rest time by the muscle mass an exercise recruits — big
    // compounds and lower-body lifts need more recovery between sets than
    // isolation work (broadly in line with Schoenfeld et al.'s rest-interval
    // findings: ~2-3min for compounds, ~60-90s for isolation). Matched by
    // keyword against the free-typed exercise name, same approach as
    // muscle-tracker.html's EXERCISE_MUSCLE_MAP — no match falls back to a
    // safe middle-ground default.
    // sec is the low end of the range — the alert fires as soon as that
    // minimum is reached, since more rest is always fine, less isn't.
    const REST_SUGGESTIONS = [
      { match: /soulev[ée].*terre|deadlift|squat|presse.*cuisses|leg.?press|d[ée]velopp[ée].*couch[ée]|\bbench\b|tirage|rowing|\brow\b|traction|pull.?up|chin.?up/i, label: '2-3 min', sec: 120 },
      { match: /d[ée]velopp[ée].*militaire|overhead|shoulder.?press|fente|lunge|split.?squat|bulgarian|\bdips?\b|hip.?thrust/i, label: '~2 min', sec: 100 },
      { match: /curl|extension.*triceps|triceps|pushdown|skull.?crusher|kickback|[ée]l[ée]vation|lateral.?raise|front.?raise|oiseau|rear.?delt|face.?pull|mollet|calf|abdo|crunch|gainage|plank|planche|obliqu|poignet|wrist/i, label: '60-90 s', sec: 60 }
    ];
    function suggestRest(name){
      const n = String(name || '');
      for (const r of REST_SUGGESTIONS) if (r.match.test(n)) return r;
      return { label: '~2 min', sec: 100 };
    }

    // ---- timer state ----
    let timerMs = 0, timerRunning = false, timerStartedAt = 0, timerInterval = null;
    let restTargetSec = 100, restAlertFired = false;

    // Web Audio needs to be created/resumed inside a user-gesture handler on
    // iOS Safari or it stays silent — timerStartPause (a tap) is that gesture,
    // so the context is created there and reused for every beep after.
    let audioCtx = null;
    function ensureAudioCtx(){
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch(e) { audioCtx = null; }
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function playRestAlert(){
      const ctx = audioCtx;
      if (!ctx) return;
      const now = ctx.currentTime;
      [660, 880].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const t0 = now + i * 0.16;
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.25, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.24);
      });
      if (navigator.vibrate) { try { navigator.vibrate([120, 60, 120]); } catch(e){} }
    }
    function timerTick(){
      const el = document.getElementById('timerDisplay');
      if (!el) return;
      const total = timerMs + (timerRunning ? (Date.now() - timerStartedAt) : 0);
      const s = Math.floor(total / 1000);
      el.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
      if (timerRunning && !restAlertFired && s >= restTargetSec) {
        restAlertFired = true;
        el.classList.add('rest-ready');
        playRestAlert();
      }
    }
    function timerStartPause(){
      if (timerRunning) {
        timerMs += Date.now() - timerStartedAt;
        timerRunning = false;
        clearInterval(timerInterval);
      } else {
        ensureAudioCtx();
        timerStartedAt = Date.now();
        timerRunning = true;
        timerInterval = setInterval(timerTick, 250);
      }
      const btn = document.getElementById('timerStartPause');
      if (btn) btn.textContent = timerRunning ? 'Pause' : 'Démarrer';
      timerTick();
    }
    function timerReset(){
      timerMs = 0; timerRunning = false;
      restAlertFired = false;
      clearInterval(timerInterval);
      const btn = document.getElementById('timerStartPause');
      if (btn) btn.textContent = 'Démarrer';
      const el = document.getElementById('timerDisplay');
      if (el) el.classList.remove('rest-ready');
      timerTick();
    }

    // ---- wake lock (keeps the phone screen on during live mode) ----
    async function acquireWakeLock(){
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; updateWakeLockPill(); });
          updateWakeLockPill();
        }
      } catch(e) { updateWakeLockPill(); }
    }
    function releaseWakeLock(){
      if (wakeLock) { try { wakeLock.release(); } catch(e){} wakeLock = null; }
    }
    function updateWakeLockPill(){
      const pill = document.getElementById('wakeLockPill');
      if (!pill) return;
      if (wakeLock) { pill.textContent = '🔒 Écran maintenu allumé'; pill.classList.add('on'); }
      else { pill.textContent = '🔓 Veille non bloquée'; pill.classList.remove('on'); }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && document.body.classList.contains('seance-live') && !wakeLock) {
        acquireWakeLock();
      }
    });

    let liveSessionStartTs = null;
    function startLive(){
      document.body.classList.add('seance-live');
      liveSessionStartTs = Date.now();
      timerReset();
      renderLive();
      acquireWakeLock();
    }
    function endLive(){
      if (liveSessionStartTs) {
        const durationMin = Math.round((Date.now() - liveSessionStartTs) / 60000);
        if (durationMin > 0) saveSessionDuration(todayStr(), chosenDay, durationMin);
        liveSessionStartTs = null;
      }
      releaseWakeLock();
      clearInterval(timerInterval);
      document.body.classList.remove('seance-live');
      chosenDay = null; queue = []; currentIdx = 0;
      renderDayPick();
    }

    // One side's input block (weight/reps/RIR/échec) — used twice for a
    // unilateral exercise (suffix 'G'/'D'), once for a normal one (suffix '').
    // RIR (reps in reserve) gets quick 0/1 buttons — per Zourdos et al.
    // (2016)'s RIR-based RPE scale, 0-1 RIR is where an estimate is still
    // reliable; beyond that self-rating gets noisy fast, so higher values
    // stay a free-typed number rather than more buttons. RIR 0 is kept
    // explicitly separate from Échec (true failure, missing the rep
    // entirely) — they measure different things and get conflated a lot.
    function sideBlockHtml(suffix, labelPrefix, weight, reps){
      return '<div class="live-input-row">' +
        '<div class="live-input-col"><label>' + labelPrefix + 'Poids (' + unit + ')</label><input type="number" step="0.1" inputmode="decimal" id="liveWeight' + suffix + '" value="' + weight + '"></div>' +
        '<div class="live-input-col"><label>' + labelPrefix + 'Reps</label><input type="number" inputmode="numeric" id="liveReps' + suffix + '" value="' + reps + '"></div>' +
        '</div>' +
        '<div class="live-rir-row">' +
        '<span class="live-rir-label">RIR</span>' +
        '<input type="number" min="0" inputmode="numeric" class="live-rir-input" id="liveRir' + suffix + '" placeholder="—">' +
        '<button type="button" class="live-rir-btn" data-rir-target="' + suffix + '" data-rir-val="0">0</button>' +
        '<button type="button" class="live-rir-btn" data-rir-target="' + suffix + '" data-rir-val="1">1</button>' +
        '<button type="button" class="live-fail-toggle small" id="liveFailToggle' + suffix + '">Échec</button>' +
        '</div>';
    }
    function renderLive(){
      const ex = queue[currentIdx];
      const day = days.find(d => d.id === chosenDay);
      const last = lastLogFor(state, ex.id);
      const rest = suggestRest(ex.name);
      restTargetSec = rest.sec;
      if (!(ex.id in setCounts)) setCounts[ex.id] = 1;
      if (!(ex.id in targetCache)) targetCache[ex.id] = suggestNextTarget(state, ex);
      const target = targetCache[ex.id];
      const prefWeight = target ? target.weight : (last ? last.weight : '');
      const prefReps = target ? target.reps : (last ? last.reps : '');

      app.innerHTML =
        '<div class="live-view">' +
        '<div class="live-head"><span class="live-day-name">' + escapeHtml(day ? day.name : '') + '</span>' +
        '<button type="button" class="live-end-btn" id="liveEndBtn">Terminer</button></div>' +
        '<div class="gm-card live-current">' +
        (ex.image ? '<img class="live-ex-img" src="' + ex.image + '" alt="">' : '<div class="live-ex-img-placeholder">🏋️</div>') +
        '<h2 class="live-ex-name">' + escapeHtml(ex.name) + '</h2>' +
        '<div class="live-set-label">Série <span id="liveSetNum">' + setCounts[ex.id] + '</span></div>' +
        (target ? '<div class="live-target-note">🎯 ' + target.weight + (state.units || 'kg') + ' × ' + target.reps + '<span>' + escapeHtml(target.note) + '</span></div>' : '') +
        '<div class="wakelock-pill" id="wakeLockPill">—</div>' +
        '</div>' +
        '<div class="gm-card timer-card">' +
        '<div class="timer-display" id="timerDisplay">00:00</div>' +
        '<div class="timer-suggest">⏱ Repos conseillé pour cet exercice : ' + rest.label + '</div>' +
        '<div class="timer-controls">' +
        '<button type="button" class="timer-btn primary" id="timerStartPause">Démarrer</button>' +
        '<button type="button" class="timer-btn" id="timerReset">Réinitialiser</button>' +
        '</div></div>' +
        '<div class="gm-card">' +
        (ex.unilateral ?
          '<div class="live-set-form">' +
          sideBlockHtml('G', 'Gauche — ', prefWeight, prefReps) +
          '<div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06);">' + sideBlockHtml('D', 'Droite — ', prefWeight, prefReps) + '</div>' +
          '<button type="button" class="live-validate-btn" id="liveValidateSet" style="margin-top:10px;">✓ Valider la série</button>' +
          '</div>'
        :
          '<div class="live-set-form">' +
          sideBlockHtml('', '', prefWeight, prefReps) +
          '<button type="button" class="live-validate-btn" id="liveValidateSet" style="margin-top:10px;">✓ Valider la série</button>' +
          '</div>'
        ) + '</div>' +
        '<div class="live-queue-title">File d\'attente — ' + escapeHtml(day ? day.name : '') + '</div>' +
        '<div id="liveQueue"></div>' +
        '</div>';

      updateWakeLockPill();
      timerTick();
      renderQueue();

      const spBtn = document.getElementById('timerStartPause');
      spBtn.textContent = timerRunning ? 'Pause' : 'Démarrer';
      document.getElementById('liveEndBtn').addEventListener('click', endLive);
      spBtn.addEventListener('click', timerStartPause);
      document.getElementById('timerReset').addEventListener('click', timerReset);
      const sides = ex.unilateral ? ['G', 'D'] : [''];
      sides.forEach(suffix => {
        document.getElementById('liveFailToggle' + suffix).addEventListener('click', (e) => e.currentTarget.classList.toggle('active'));
      });
      app.querySelectorAll('.live-rir-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const suffix = btn.dataset.rirTarget, val = btn.dataset.rirVal;
          const input = document.getElementById('liveRir' + suffix);
          const wasActive = btn.classList.contains('active');
          input.value = wasActive ? '' : val;
          app.querySelectorAll('.live-rir-btn[data-rir-target="' + suffix + '"]').forEach(b => b.classList.toggle('active', !wasActive && b === btn));
        });
      });
      document.getElementById('liveValidateSet').addEventListener('click', validateSet);
    }

    function renderQueue(){
      const q = document.getElementById('liveQueue');
      if (!q) return;
      q.innerHTML = queue.map((ex, i) =>
        '<div class="live-queue-item' + (i === currentIdx ? ' current' : '') + '" data-idx="' + i + '">' +
        (ex.image ? '<img class="live-queue-thumb" src="' + ex.image + '" alt="">' : '<div class="live-queue-thumb"></div>') +
        '<span class="live-queue-name">' + escapeHtml(ex.name) + '</span>' +
        '<span class="live-queue-badge">' + (i === currentIdx ? 'EN COURS' : (setCounts[ex.id] ? (setCounts[ex.id]-1) + ' série(s)' : '')) + '</span>' +
        '</div>'
      ).join('');
      q.querySelectorAll('.live-queue-item').forEach(el => {
        el.addEventListener('click', () => {
          const i = parseInt(el.dataset.idx, 10);
          if (i === currentIdx) return;
          currentIdx = i;
          renderLive();
        });
      });
    }

    function validateSet(){
      const ex = queue[currentIdx];
      // Rest time is read straight off the timer instead of asking for a
      // separate "I'm doing my set now" tap: validateSet() already resets
      // and restarts it right after each set (below), so whatever it reads
      // right before that reset IS the rest since the previous set — free
      // signal from an interaction he's already doing.
      const restSec = Math.round((timerMs + (timerRunning ? Date.now() - timerStartedAt : 0)) / 1000);
      state.logs = state.logs || {};
      state.logs[ex.id] = state.logs[ex.id] || [];
      const base = { date: todayStr(), time: nowTimeStr(), dayId: chosenDay, restSec: restSec };

      function readRir(suffix) {
        const raw = document.getElementById('liveRir' + suffix).value;
        return raw === '' ? null : Math.max(0, parseInt(raw, 10) || 0);
      }
      if (ex.unilateral) {
        const wG = parseFloat(document.getElementById('liveWeightG').value);
        const rG = parseInt(document.getElementById('liveRepsG').value, 10);
        const wD = parseFloat(document.getElementById('liveWeightD').value);
        const rD = parseInt(document.getElementById('liveRepsD').value, 10);
        if (!rG && !rD) return;
        const failG = document.getElementById('liveFailToggleG').classList.contains('active');
        const failD = document.getElementById('liveFailToggleD').classList.contains('active');
        if (rG) state.logs[ex.id].push(Object.assign({ id: uid() }, base, { weight: isNaN(wG) ? 0 : wG, reps: rG, failed: failG, rir: readRir('G'), side: 'G' }));
        if (rD) state.logs[ex.id].push(Object.assign({ id: uid() }, base, { weight: isNaN(wD) ? 0 : wD, reps: rD, failed: failD, rir: readRir('D'), side: 'D' }));
      } else {
        const weight = parseFloat(document.getElementById('liveWeight').value);
        const reps = parseInt(document.getElementById('liveReps').value, 10);
        if (!reps) return;
        const failed = document.getElementById('liveFailToggle').classList.contains('active');
        state.logs[ex.id].push(Object.assign({ id: uid() }, base, { weight: isNaN(weight) ? 0 : weight, reps: reps, failed: failed, rir: readRir('') }));
      }

      saveGym(state);
      setCounts[ex.id] = (setCounts[ex.id] || 1) + 1;
      timerReset();
      timerStartPause(); // auto-starts the rest timer for the next set
      renderLive();
    }
  }
})();
</script>
<script id="atmo-backdrop-js">
(function () {
  function spawnParticles() {
    var root = document.getElementById('atmoParticles');
    if (!root) return;
    root.innerHTML = '';
    var N = window.innerWidth < 640 ? 12 : 20;
    for (var i = 0; i < N; i++) {
      var s = document.createElement('span');
      s.style.left = (Math.random() * 100) + '%';
      s.style.top = (55 + Math.random() * 45) + '%';
      var size = 1.1 + Math.random() * 1.2;
      s.style.width = s.style.height = size + 'px';
      var dur = 24 + Math.random() * 30;
      s.style.animationDuration = dur + 's';
      s.style.animationDelay = (-Math.random() * dur) + 's';
      s.style.setProperty('--dx', (Math.random() * 28 - 14) + 'px');
      s.style.setProperty('--dy', -(55 + Math.random() * 45) + 'vh');
      root.appendChild(s);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', spawnParticles);
  else spawnParticles();
})();
</script>
