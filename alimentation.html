<!DOCTYPE html>
<html lang="fr">
<head>
<script src="lock.js"></script>
<script src="/api/config"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Alimentation · Tableau de bord</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>

<style>
:root {
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --success: #6BE3A4;
  --warning: #F2C063;
  --danger:  #FF6B6B;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: #050506; color: var(--text-secondary);
  font-family: var(--font); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh; position: relative; overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(132,204,22,0.14), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(180,180,200,0.06), transparent 50%);
  filter: blur(40px); pointer-events: none; z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px; pointer-events: none; z-index: -1;
}
@keyframes drift {
  0%   { transform: translate3d(0,0,0); }
  100% { transform: translate3d(-22px, 14px, 0); }
}
/* ===== Fond atmosphérique "Récolte" (vert-citron + particules) ===== */
.atmo-wash {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(60% 50% at 50% 20%, rgba(132,204,22,0.13) 0%, rgba(132,204,22,0.05) 35%, transparent 65%),
    radial-gradient(50% 40% at 80% 85%, rgba(90,140,20,0.10) 0%, transparent 60%),
    radial-gradient(120% 80% at 50% 100%, rgba(14,20,6,0.5) 0%, rgba(4,6,10,0.95) 75%);
  background-repeat: no-repeat; background-size: 100% 100%;
}
.atmo-particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.atmo-particles span {
  position: absolute; width: 1.5px; height: 1.5px; border-radius: 50%;
  background: rgba(210,240,170,0.7);
  animation: atmo-drift linear infinite;
  box-shadow: 0 0 6px rgba(132,204,22,0.55);
}
@keyframes atmo-drift {
  0%   { transform: translate3d(0, 0, 0); opacity: 0; }
  10%  { opacity: 0.7; }
  90%  { opacity: 0.5; }
  100% { transform: translate3d(var(--dx, 12px), var(--dy, -100vh), 0); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .atmo-particles span { animation: none; } }

.page { max-width: 640px; margin: 0 auto; position: relative; z-index: 5; }
.dash-title {
  margin: 0 0 4px; font-size: 28px; font-weight: 700; letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.gm-card {
  position: relative; background: rgba(255, 255, 255, 0.04); border-radius: 16px;
  padding: 28px 22px; margin-bottom: 14px; text-align: center;
  backdrop-filter: blur(24px) saturate(1.2); -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
}
.gm-emoji { font-size: 40px; margin-bottom: 10px; }
.gm-card h2 { margin: 0 0 8px; font-size: 17px; color: var(--text-primary); }
.gm-card p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--text-tertiary); }
.cross-nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
.cross-nav a {
  display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.035);
  color: var(--text-secondary); text-decoration: none; font-size: 12.5px; font-weight: 600;
  transition: background .15s, color .15s;
}
.cross-nav a:hover { background: rgba(255,255,255,0.07); color: var(--text-primary); }
@media (max-width: 480px) {
  body { padding: max(20px, env(safe-area-inset-top)) 14px 50px; }
  .dash-title { font-size: 22px; }
}
</style>
</head>
<body>

<div id="atmo-backdrop" aria-hidden="true">
  <div class="atmo-wash"></div>
  <div class="atmo-particles" id="atmoParticles"></div>
</div>

<div class="page">
  <h1 class="dash-title">Alimentation</h1>
  <div class="gm-card">
    <div class="gm-emoji">🍎</div>
    <h2>Bientôt disponible</h2>
    <p>Dis-moi ce que tu veux suivre ici — repas, calories, macros, hydratation liée aux repas, etc. — et je le construis, dans le même esprit que Séance et Fatigue : basé sur de vraies données, rien d'inventé.</p>
    <div class="cross-nav">
      <a href="gym.html">💪 Fitness</a>
      <a href="seance.html">🏋️ Séance</a>
      <a href="fatigue.html">🔋 Fatigue</a>
    </div>
  </div>
</div>

<script id="atmo-backdrop-js">
(function () {
  function spawnParticles() {
    var root = document.getElementById('atmoParticles');
    if (!root) return;
    root.innerHTML = '';
    var N = window.innerWidth < 640 ? 12 : 20;
    for (var i = 0; i < N; i++) {
      var s = document.createElement('span');
      s.style.left = (Math.random() * 100) + '%';
      s.style.top = (55 + Math.random() * 45) + '%';
      var size = 1.1 + Math.random() * 1.2;
      s.style.width = s.style.height = size + 'px';
      var dur = 24 + Math.random() * 30;
      s.style.animationDuration = dur + 's';
      s.style.animationDelay = (-Math.random() * dur) + 's';
      s.style.setProperty('--dx', (Math.random() * 28 - 14) + 'px');
      s.style.setProperty('--dy', -(55 + Math.random() * 45) + 'vh');
      root.appendChild(s);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', spawnParticles);
  else spawnParticles();
})();
</script>
</body>
</html>
