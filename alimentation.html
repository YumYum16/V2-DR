<!DOCTYPE html>
<html lang="fr">
<head>
<script src="lock.js"></script>
<script src="/api/config"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Alimentation · Tableau de bord</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="topbar.js" defer></script>

<style>
:root {
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --success: #6BE3A4;
  --warning: #F2C063;
  --danger:  #FF6B6B;
  --lime: #84CC16;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: #050506; color: var(--text-secondary);
  font-family: var(--font); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh; position: relative; overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(132,204,22,0.14), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(180,180,200,0.06), transparent 50%);
  filter: blur(40px); pointer-events: none; z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px; pointer-events: none; z-index: -1;
}
@keyframes drift { 0%{transform:translate3d(0,0,0)} 100%{transform:translate3d(-22px,14px,0)} }
.atmo-wash {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(60% 50% at 50% 20%, rgba(132,204,22,0.13) 0%, rgba(132,204,22,0.05) 35%, transparent 65%),
    radial-gradient(50% 40% at 80% 85%, rgba(90,140,20,0.10) 0%, transparent 60%),
    radial-gradient(120% 80% at 50% 100%, rgba(14,20,6,0.5) 0%, rgba(4,6,10,0.95) 75%);
  background-repeat: no-repeat; background-size: 100% 100%;
}
.atmo-particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.atmo-particles span {
  position: absolute; width: 1.5px; height: 1.5px; border-radius: 50%;
  background: rgba(210,240,170,0.7);
  animation: atmo-drift linear infinite;
  box-shadow: 0 0 6px rgba(132,204,22,0.55);
}
@keyframes atmo-drift {
  0%   { transform: translate3d(0, 0, 0); opacity: 0; }
  10%  { opacity: 0.7; } 90%  { opacity: 0.5; }
  100% { transform: translate3d(var(--dx, 12px), var(--dy, -100vh), 0); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .atmo-particles span { animation: none; } }

.page { max-width: 640px; margin: 0 auto; position: relative; z-index: 5; }
.dash-title {
  margin: 0 0 4px; font-size: 28px; font-weight: 700; letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.dash-sub { margin: 0 0 18px; font-size: 13px; line-height: 1.5; color: var(--text-tertiary); }
.gm-card {
  position: relative; background: rgba(255, 255, 255, 0.04); border-radius: 16px;
  padding: 20px; margin-bottom: 14px;
  backdrop-filter: blur(24px) saturate(1.2); -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
}
.section-title {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-tertiary); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.empty-note { text-align: center; font-size: 13px; color: var(--text-tertiary); padding: 10px 4px; line-height: 1.6; }
.gm-ghost {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.04); color: var(--text-primary);
  font-family: inherit; font-size: 12.5px; font-weight: 600; text-decoration: none; cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.gm-ghost:hover { background: rgba(255,255,255,0.07); }
.gm-add {
  padding: 12px 18px; border: 0; border-radius: 12px;
  background: linear-gradient(180deg, #FFFFFF 0%, #E8E5DD 100%); color: #0A0A0B;
  font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer;
}

/* ---- info panel ---- */
details.info {
  margin: 0 0 18px; padding: 2px 18px; font-size: 12.5px; color: var(--text-secondary); line-height: 1.55;
}
details.info summary { cursor: pointer; padding: 12px 0; color: var(--text-primary); font-weight: 600; list-style: none; }
details.info summary::-webkit-details-marker { display: none; }
details.info p { margin: 8px 0; } details.info strong { color: var(--text-primary); }

/* ---- rings ---- */
.ring-row { display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; margin-bottom: 14px; }
.ring-wrap { position: relative; width: 92px; height: 92px; text-align: center; }
.ring-wrap svg { transform: rotate(-90deg); }
.ring-track { fill: none; stroke: rgba(255,255,255,0.07); stroke-width: 8; }
.ring-fill { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease, stroke 0.3s; }
.ring-label-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-num { font-size: 16px; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.ring-target { font-size: 10px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; margin-top: -1px; }
.ring-name { font-size: 10px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-tertiary); margin-top: 1px; }
.kcal-total { text-align: center; font-size: 13px; color: var(--text-secondary); }
.kcal-total strong { color: var(--text-primary); font-size: 22px; font-variant-numeric: tabular-nums; }
.kcal-remaining { font-size: 12px; margin-top: 2px; font-weight: 600; }
.salt-row { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); }
.salt-row-head { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-tertiary); margin-bottom: 6px; }
.salt-row-head strong { color: var(--text-primary); font-variant-numeric: tabular-nums; }
.salt-bar-track { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.06); overflow: hidden; }
.salt-bar-fill { height: 100%; border-radius: 999px; transition: width .4s ease; }

/* ---- program ---- */
.program-badge {
  display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
  background: rgba(132,204,22,0.14); color: var(--lime); margin-bottom: 10px;
}
.program-badge.warn { background: rgba(242,192,99,0.14); color: var(--warning); }
.program-badge.bad { background: rgba(255,107,107,0.14); color: var(--danger); }
.program-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 12.5px; }
.program-row:last-child { border-bottom: 0; }
.program-row span:first-child { color: var(--text-tertiary); }
.program-row span:last-child { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }
.program-note { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06); font-size: 12px; color: var(--text-tertiary); line-height: 1.5; }

/* ---- macro gap suggestions ---- */
.macro-tips { list-style: none; margin: 0; padding: 0; }
.macro-tip { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; font-size: 13px; color: var(--text-secondary); line-height: 1.5; border-top: 1px solid rgba(255,255,255,0.06); }
.macro-tip:first-child { border-top: 0; }
.macro-tip .ic { flex-shrink: 0; }
.macro-tip strong { color: var(--text-primary); }

/* ---- food calendar ---- */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
.cal-nav-btn {
  width: 32px; height: 32px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.04); color: var(--text-primary); font-size: 16px; line-height: 1;
  cursor: pointer; -webkit-tap-highlight-color: transparent; flex-shrink: 0;
}
.cal-nav-btn:hover { background: rgba(255,255,255,0.08); }
.cal-month { font-size: 14px; font-weight: 700; color: var(--text-primary); }
.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 5px; }
.cal-weekday { text-align: center; font-size: 9.5px; font-weight: 700; color: var(--text-tertiary); letter-spacing: 0.06em; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-cell {
  aspect-ratio: 0.82; border-radius: 9px; background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06); border-left: 3px solid transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 3px 2px; font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, border-color 0.15s;
}
.cal-cell.logged:hover { background: rgba(255,255,255,0.07); }
.cal-cell.empty { cursor: default; opacity: 0.5; }
.cal-cell.today { box-shadow: inset 0 0 0 1px rgba(132,204,22,0.45); }
.cal-day { font-size: 10.5px; font-weight: 700; color: var(--text-primary); }
.cal-score { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cal-score-empty { color: var(--text-tertiary); font-weight: 400; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); }
.cal-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-tertiary); }
.cal-legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

/* ---- day detail modal ---- */
.day-detail-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.day-detail-score {
  width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0; border: 1px solid;
  display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800;
}
.day-detail-badges { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---- food log ---- */
.log-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.log-row:last-child { border-bottom: 0; }
.log-name { flex: 1; font-size: 13.5px; color: var(--text-primary); font-weight: 600; }
.log-meta { font-size: 11px; color: var(--text-tertiary); }
.log-macros { font-size: 11px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; white-space: nowrap; }
.log-del { border: 0; background: none; color: var(--text-tertiary); font-size: 16px; cursor: pointer; padding: 4px 6px; }
.log-del:hover { color: var(--danger); }

/* ---- add-food form ---- */
.field-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.field-col { flex: 1 1 120px; display: flex; flex-direction: column; gap: 6px; }
.field-col label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); }
.field-col input, .field-col select {
  padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
  background: rgba(0,0,0,0.28); color: var(--text-primary); font-family: inherit; font-size: 14px;
}
.food-pick-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; margin-bottom: 10px; }
.food-cat-label {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-tertiary); margin: 12px 0 2px; padding: 0 2px;
}
.food-cat-label:first-child { margin-top: 2px; }
.food-pick-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
  background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.06);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.food-pick-item:hover { background: rgba(255,255,255,0.07); }
.food-pick-item.active { border-color: rgba(132,204,22,0.4); background: rgba(132,204,22,0.08); }
.food-pick-name { flex: 1; font-size: 13.5px; color: var(--text-primary); font-weight: 600; }
.food-pick-macro { font-size: 10.5px; color: var(--text-tertiary); }
.food-pick-del { border: 0; background: none; color: var(--text-tertiary); font-size: 14px; cursor: pointer; padding: 2px 6px; }
.food-pick-del:hover { color: var(--danger); }
.seg-toggle { display: inline-flex; border: 1px solid rgba(255,255,255,0.10); border-radius: 999px; overflow: hidden; background: rgba(0,0,0,0.25); margin-bottom: 14px; }
.seg-toggle button {
  border: 0; background: transparent; color: var(--text-tertiary); font-family: inherit;
  font-size: 12px; font-weight: 700; padding: 9px 16px; cursor: pointer;
}
.seg-toggle button.active { background: rgba(132,204,22,0.16); color: var(--lime); }
.cat-filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.cat-filter-btn {
  border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.035); color: var(--text-tertiary);
  font-family: inherit; font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 999px; cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
}
.cat-filter-btn:hover { color: var(--text-primary); }
.cat-filter-btn.active { background: rgba(132,204,22,0.16); color: var(--lime); border-color: rgba(132,204,22,0.35); }
.modal-bg {
  display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.6);
  align-items: flex-end; justify-content: center; padding: 0;
}
.modal-bg.show { display: flex; }
.modal {
  background: #14140f; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px 20px 0 0;
  padding: 22px 18px max(22px, env(safe-area-inset-bottom)); width: 100%; max-width: 640px; max-height: 86vh; overflow-y: auto;
}
/* PC has room to spare — wider sheet, taller list, so browsing/creating
   foods doesn't feel as cramped as the phone bottom-sheet layout. */
@media (min-width: 820px) {
  .modal-bg { align-items: center; padding: 24px; }
  .modal { max-width: 820px; border-radius: 20px; max-height: 82vh; }
  .food-pick-list { max-height: 440px; }
}
.modal h3 { margin: 0 0 14px; font-size: 16px; color: var(--text-primary); }
.modal-actions { display: flex; gap: 8px; margin-top: 14px; }
.modal-actions button { flex: 1; padding: 12px; border-radius: 12px; font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; }
.btn-secondary { border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.04); color: var(--text-primary); }
.btn-primary { border: 0; background: linear-gradient(180deg, #FFFFFF 0%, #E8E5DD 100%); color: #0A0A0B; }

.cross-nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.cross-nav a {
  display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.035);
  color: var(--text-secondary); text-decoration: none; font-size: 12.5px; font-weight: 600;
}
.cross-nav a:hover { background: rgba(255,255,255,0.07); color: var(--text-primary); }

/* PC has room to spare — two columns of cards so the page reads more
   like a dashboard and less like a long phone-width scroll, without
   touching the phone layout above. Title/intro/info panel and the
   bottom nav span the full width; each card stays intact in one column
   (break-inside: avoid) instead of splitting mid-content. */
@media (min-width: 900px) {
  .page { max-width: 1040px; column-count: 2; column-gap: 18px; }
  .dash-title, .dash-sub, details.info, .cross-nav { column-span: all; }
  .gm-card { break-inside: avoid; }
}

@media (max-width: 480px) {
  body { padding: max(20px, env(safe-area-inset-top)) 14px 50px; }
  .dash-title { font-size: 22px; }
}
</style>
</head>
<body>

<div id="atmo-backdrop" aria-hidden="true">
  <div class="atmo-wash"></div>
  <div class="atmo-particles" id="atmoParticles"></div>
</div>

<div class="page" id="app"></div>

<script>
(async function(){
  'use strict';

  const WATER_KEY = 'po_water_v1';
  const GYM_KEY = 'po_coach_v1';
  const WEIGHTS_KEY = 'po_coach_weights';
  const FOOD_DB_KEY = 'po_food_db_v1';
  const FOOD_LOG_KEY = 'po_food_log_v1';
  const PROGRAM_KEY = 'po_nutrition_program_v1';
  const MOOD_KEY = 'po_motivation_v1';
  const DAY_MS = 86400000;

  // ================================================================
  // CLOUD SYNC — own Supabase row ("nutrition"), same pull-once /
  // push-on-write pattern as Séance/Fatigue. Pulled before anything
  // reads local state below.
  // ================================================================
  const PC_APP_KEY = 'nutrition';
  const PC_SUPABASE_URL = window.DASH_SUPABASE_URL || 'https://srajryooffirbroltjmg.supabase.co';
  const PC_SUPABASE_KEY = window.DASH_SUPABASE_KEY || 'sb_publishable_5142ZwTLF_DkSVRzciNuRA_bHwRAu4c';
  const PC_SYNCED_KEYS = [FOOD_DB_KEY, FOOD_LOG_KEY, PROGRAM_KEY];
  // Marks "the last push to the cloud didn't confirm" (offline, request
  // failed, etc). Never itself synced — purely a local flag. Without this,
  // a save made while offline would sit correctly in localStorage but
  // never reach the cloud, and the NEXT load's pcPullOnce() would blindly
  // overwrite localStorage with the (now stale) cloud copy — silently
  // erasing the offline entry on this same device. See pcPullOnce().
  const PC_PENDING_KEY = 'po_nutrition_pc_pending_v1';
  let pcSupa = null;
  if (window.supabase && PC_SUPABASE_URL.indexOf('PASTE-') !== 0 && PC_SUPABASE_KEY.indexOf('PASTE-') !== 0) {
    try { pcSupa = window.supabase.createClient(PC_SUPABASE_URL, PC_SUPABASE_KEY); } catch (e) {}
  }
  async function pcPullOnce() {
    if (!pcSupa) return;
    // Retry any push that failed to confirm before pulling — otherwise
    // this pull would overwrite the newer local data (from that failed
    // push) with the older cloud copy it never reached.
    if (localStorage.getItem(PC_PENDING_KEY)) {
      await pcPushNow();
      if (localStorage.getItem(PC_PENDING_KEY)) return; // still failing (offline?) — don't pull stale data over newer local data
    }
    try {
      const result = await Promise.race([
        pcSupa.from('app_state').select('data').eq('key', PC_APP_KEY).maybeSingle(),
        new Promise((resolve) => setTimeout(() => resolve(null), 4000))
      ]);
      if (!result) return;
      const { data, error } = result;
      if (!error && data && data.data) {
        Object.keys(data.data).forEach(k => {
          if (PC_SYNCED_KEYS.indexOf(k) === -1) return;
          try { localStorage.setItem(k, JSON.stringify(data.data[k])); } catch (e) {}
        });
      }
    } catch (e) {}
  }
  async function pcPushNow() {
    if (!pcSupa) return;
    const out = {};
    PC_SYNCED_KEYS.forEach(k => {
      const v = localStorage.getItem(k);
      if (v == null) return;
      try { out[k] = JSON.parse(v); } catch (e) { out[k] = v; }
    });
    try {
      const { error } = await pcSupa.from('app_state').upsert(
        { key: PC_APP_KEY, data: out, updated_at: new Date().toISOString() }, { onConflict: 'key' }
      );
      if (error) throw error;
      try { localStorage.removeItem(PC_PENDING_KEY); } catch (e) {}
    } catch (e) {
      try { localStorage.setItem(PC_PENDING_KEY, '1'); } catch (e2) {}
    }
  }
  // Retry as soon as connectivity comes back, instead of waiting for the
  // next save or the next full page load.
  window.addEventListener('online', () => { if (localStorage.getItem(PC_PENDING_KEY)) pcPushNow(); });
  // Day placements (repos/entraînement) and mood check-ins are owned by
  // Calendrier/Fatigue, stored in their own "po-coach" row — pull those
  // keys read-only so a device that only ever opens Alimentation still
  // sees the real placement/mood instead of stale or empty local data
  // (needed for the food calendar's day-type badge and humeur below).
  async function pcPullOverridesOnce() {
    if (!pcSupa) return;
    try {
      const result = await Promise.race([
        pcSupa.from('app_state').select('data').eq('key', 'po-coach').maybeSingle(),
        new Promise((resolve) => setTimeout(() => resolve(null), 4000))
      ]);
      if (!result) return;
      const { data, error } = result;
      if (!error && data && data.data) {
        ['po_day_overrides_v1', MOOD_KEY].forEach(k => {
          if (data.data[k] !== undefined) {
            try { localStorage.setItem(k, JSON.stringify(data.data[k])); } catch (e) {}
          }
        });
      }
    } catch (e) {}
  }

  // ---- storage helpers ----
  function loadJSON(k, fallback) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fallback : v; } catch (e) { return fallback; } }
  function saveJSON(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); pcPushNow(); return true; }
    catch (e) {
      console.error('save failed', k, e);
      if (!window.__lastSaveFailAlert || Date.now() - window.__lastSaveFailAlert > 60000) {
        window.__lastSaveFailAlert = Date.now();

  }
  // Institute of Medicine (2005), Dietary Reference Intakes for Energy,
  // Carbohydrate, Fiber, Fat, Fatty Acids, Cholesterol, Protein, and Amino
  // Acids — Adequate Intake for fiber, by age/sex (not a per-kcal rule of
  // thumb; these are the actual reference values). Kept flat rather than
  // scaled down with the cut's calorie deficit: fiber's satiety benefit
  // (Slavin, 2005, Nutrition review) matters more, not less, on fewer
  // calories.
  function fiberTargetG(profile) {
    const age = profile.age || 25;
    if (profile.sex === 'f') return age > 50 ? 21 : 25;
    return age > 50 ? 30 : 38;
  }

  // ================================================================
  // MACRO GAP SUGGESTIONS — "what should I eat to close today's gap
  // without blowing my kcal budget", computed only from foods already in
  // your own database (Mes aliments), picking whichever has the best
  // ratio of the missing macro per kcal. Small, at most 2 tips (the two
  // biggest relative gaps), and it backs off entirely once the calorie
  // budget for the day is already spent.
  // ================================================================
  const MACRO_TIP_MIN_GAP_G = { protein: 5, fiber: 3, carbs: 10, fat: 5 };
  function bestFoodForMacro(field, db) {
    let best = null, bestRatio = -1;
    db.forEach(f => {
      const kcal = f.kcalPer100g || 0, macro = f[field] || 0;
      if (kcal <= 0 || macro <= 0) return;
      const ratio = macro / kcal;
      if (ratio > bestRatio) { bestRatio = ratio; best = f; }
    });
    return best;
  }
  function renderMacroTipsCard(targets, totals, fiberTarget, db) {
    const kcalRemaining = targets.target - totals.kcal;
    const defs = [
      { field: 'proteinPer100g', label: 'Protéines', icon: '🥩', unit: 'g de protéines', targetG: targets.proteinG, haveG: totals.protein, min: MACRO_TIP_MIN_GAP_G.protein },
      { field: 'fiberPer100g', label: 'Fibres', icon: '🌾', unit: 'g de fibres', targetG: fiberTarget, haveG: totals.fiber, min: MACRO_TIP_MIN_GAP_G.fiber },
      { field: 'carbsPer100g', label: 'Glucides', icon: '🍞', unit: 'g de glucides', targetG: targets.carbsG, haveG: totals.carbs, min: MACRO_TIP_MIN_GAP_G.carbs },
      { field: 'fatPer100g', label: 'Lipides', icon: '🧈', unit: 'g de lipides', targetG: targets.fatG, haveG: totals.fat, min: MACRO_TIP_MIN_GAP_G.fat }
    ];
    const gaps = defs
      .map(d => Object.assign({}, d, { gapG: d.targetG - d.haveG }))
      .filter(d => d.targetG > 0 && d.gapG >= d.min)
      .sort((a, b) => (b.gapG / b.targetG) - (a.gapG / a.targetG))
      .slice(0, 2);
    if (!gaps.length) return '';
    const tips = [];
    gaps.forEach(g => {
      const food = bestFoodForMacro(g.field, db);
      if (!food) return;
      const per100 = food[g.field];
      const gramsNeeded = g.gapG * 100 / per100;
      const kcalNeeded = gramsNeeded * food.kcalPer100g / 100;
      if (kcalRemaining <= 0) {
        tips.push(g.icon + ' <strong>' + g.label + '</strong> : il te manque ' + Math.round(g.gapG) + ' ' + g.unit + ', mais tu as déjà atteint ou dépassé ton objectif calorique — pas de suggestion pour ne pas creuser davantage.');
      } else if (kcalNeeded <= kcalRemaining) {
        tips.push(g.icon + ' <strong>' + g.label + '</strong> : il te manque ' + Math.round(g.gapG) + ' ' + g.unit + '. <strong>' + escapeHtml(food.name) + '</strong> est ton option la plus efficace — ~' + Math.round(gramsNeeded) + ' g (' + Math.round(kcalNeeded) + ' kcal) comblerait l\'écart, dans ta marge de ' + Math.round(kcalRemaining) + ' kcal restants.');
      } else {
        const gramsCapped = kcalRemaining * 100 / food.kcalPer100g;
        const macroCovered = gramsCapped * per100 / 100;
        tips.push(g.icon + ' <strong>' + g.label + '</strong> : il te manque ' + Math.round(g.gapG) + ' ' + g.unit + '. <strong>' + escapeHtml(food.name) + '</strong> est le plus efficace, mais combler tout l\'écart dépasserait ta marge calorique (' + Math.round(kcalRemaining) + ' kcal restants) — à hauteur de ta marge, ~' + Math.round(gramsCapped) + ' g couvriraient ' + Math.round(macroCovered) + ' ' + g.unit + '.');
      }
    });
    if (!tips.length) return '';
    return '<div class="gm-card">' +
      '<div class="section-title">Suggestions du jour</div>' +
      '<ul class="macro-tips">' + tips.map(t => '<li class="macro-tip">' + t + '</li>').join('') + '</ul>' +
      '</div>';
  }
  // WHO: under 5g salt/day (~2000mg sodium), at least 3510mg potassium/day
  // — together these give a sodium:potassium molar ratio of ~1.0, which
  // WHO names explicitly as the target ratio (not just two separate caps).
  const SALT_TARGET_G = 5;
  const POTASSIUM_TARGET_MG = 3510;
  const SODIUM_MG_PER_SALT_G = 400; // WHO's own equivalence: 2000mg sodium = 5g salt
  const NA_ATOMIC_MASS = 23, K_ATOMIC_MASS = 39.1;
  // WHO (2015 guideline on sugars intake): free sugars < 10% of total
  // energy intake, computed against today's actual kcal target below.
  const SUGAR_TARGET_PCT = 0.10;

  // ================================================================
  // NOTE DU JOUR (0-100) — pour le calendrier alimentaire en bas de page.
  // Pas un chiffre de la littérature : une mesure de distance à la cible
  // DE CE JOUR-LÀ (kcal/macros reconstitués via computeTargetsForDate),
  // qui pénalise autant le trop que le pas-assez — pondérée vers les
  // protéines (macro le plus déterminant pour ce programme). Le sel et
  // les sucres au-delà de leur seuil retirent quelques points, atteindre
  // les fibres en ajoute. Un jour sans aucune entrée n'a pas de note
  // (null), distinct d'un 0 — "rien enregistré" n'est pas "mauvaise
  // journée".
  // ================================================================
  function componentScore(pct) {
    if (!isFinite(pct) || pct == null) return 0;
    const dist = Math.abs(pct - 1);
    return Math.max(0, 100 - dist * 140);
  }
  function dayScore(dateKey) {
    const entries = entriesForDate(dateKey);
    if (!entries.length) return null;
    const totals = totalsFor(entries);
    const targets = computeTargetsForDate(dateKey);
    const kcalPct = targets.target ? totals.kcal / targets.target : 0;
    const proteinPct = targets.proteinG ? totals.protein / targets.proteinG : 0;
    const carbsPct = targets.carbsG ? totals.carbs / targets.carbsG : 0;
    const fatPct = targets.fatG ? totals.fat / targets.fatG : 0;
    let score = componentScore(kcalPct) * 0.30 + componentScore(proteinPct) * 0.35 +
      componentScore(carbsPct) * 0.20 + componentScore(fatPct) * 0.15;
    if (totals.salt > SALT_TARGET_G) score -= Math.min(10, (totals.salt - SALT_TARGET_G) * 2);
    const sugarTargetG = (targets.target * SUGAR_TARGET_PCT) / 4;
    if (totals.sugar > sugarTargetG) score -= Math.min(10, (totals.sugar - sugarTargetG) / 3);
    if (totals.fiber >= fiberTargetG(readProfile())) score += 5;
    return Math.round(Math.max(0, Math.min(100, score)));
  }
  // Same red→amber→green ramp as the app's --danger/--warning/--success
  // palette, so a bad day and an over-target macro ring read the same way.
  function scoreColor(score) {
    if (score <= 50) {
      const t = score / 50;
      const r = Math.round(255 + (242-255)*t), g = Math.round(107 + (192-107)*t), b = Math.round(107 + (99-107)*t);
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }
    const t = (score - 50) / 50;
    const r = Math.round(242 + (107-242)*t), g = Math.round(192 + (227-192)*t), b = Math.round(99 + (164-99)*t);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  // ================================================================
  // RENDER
  // ================================================================
  const app = document.getElementById('app');
  const CROSS_NAV =
    '<div class="cross-nav">' +
    '<a href="gym.html">💪 Fitness</a>' +
    '<a href="seance.html">🏋️ Séance</a>' +
    '<a href="calendrier.html">📅 Calendrier</a>' +
    '<a href="fatigue.html">🔋 Fatigue</a>' +
    '<a href="health.html">💊 Santé</a>' +
    '</div>';

  const MONTH_NAMES = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const WEEKDAY_LABELS = ['L','M','M','J','V','S','D'];
  const MOOD_EMOJI = { 1: '😞', 2: '😕', 3: '😐', 4: '🙂', 5: '🔥' };
  let foodCalMonthOffset = 0;

  function ring(pct, color, value, target, label) {
    const r = 38, c = 2 * Math.PI * r;
    const clamped = Math.max(0, Math.min(1, pct));
    const offset = c * (1 - clamped);
    return '<div class="ring-wrap"><svg width="92" height="92" viewBox="0 0 92 92">' +
      '<circle class="ring-track" cx="46" cy="46" r="' + r + '"></circle>' +
      '<circle class="ring-fill" cx="46" cy="46" r="' + r + '" stroke="' + color + '" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '"></circle>' +
      '</svg><div class="ring-label-wrap"><div class="ring-num">' + Math.round(value) + 'g</div><div class="ring-target">/ ' + Math.round(target) + 'g</div><div class="ring-name">' + label + '</div></div></div>';
  }
  // Was capping at green forever past 100% — 500g of fat looked exactly
  // as "good" as hitting the target dead-on. Now green is the target
  // ITSELF (pct≈1), and overshooting fades green→amber→red just like
  // undershooting fades red→green, instead of a one-way ramp with no
  // ceiling.
  function ringColor(pct){
    if (pct <= 1) {
      const r = Math.round(255 - (255-107)*pct), g = Math.round(107 + (227-107)*pct), b = Math.round(107 + (164-107)*pct);
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }
    const over = Math.min(1, (pct - 1) / 0.5); // 0 at target, 1 at 150%+ of target
    if (over <= 0.5) {
      const t = over / 0.5;
      const r = Math.round(107 + (242-107)*t), g = Math.round(227 + (192-227)*t), b = Math.round(164 + (99-164)*t);
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }
    const t = (over - 0.5) / 0.5;
    const r = Math.round(242 + (255-242)*t), g = Math.round(192 + (107-192)*t), b = Math.round(99 + (107-99)*t);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  // ---- food picker: group by whichever nutrient dominates per 100g ----
  // Compares raw grams (potassium mg converted to g for a fair fight) —
  // "the biggest thing wins", exactly as asked. In practice potassium
  // rarely wins against macros by weight, so that category ends up
  // reserved for genuinely potassium-forward, low-macro foods (coconut
  // water-style), which is the useful case for the débloat card anyway.
  const CATEGORY_ORDER = ['Protéines', 'Glucides', 'Lipides', 'Potassium', 'Autre'];
  const CATEGORY_ICON = { 'Protéines': '🥩', 'Glucides': '🍞', 'Lipides': '🧈', 'Potassium': '🍌', 'Autre': '🍽️' };
  function dominantCategory(f) {
    const p = f.proteinPer100g || 0, c = f.carbsPer100g || 0, fat = f.fatPer100g || 0, k = (f.potassiumPer100g || 0) / 1000;
    const max = Math.max(p, c, fat, k);
    if (max <= 0) return 'Autre';
    if (max === p) return 'Protéines';
    if (max === c) return 'Glucides';
    if (max === fat) return 'Lipides';
    return 'Potassium';
  }
  function groupFoodsByCategory(db) {
    const groups = {};
    db.forEach(f => { const cat = dominantCategory(f); (groups[cat] = groups[cat] || []).push(f); });
    CATEGORY_ORDER.forEach(cat => { if (groups[cat]) groups[cat].sort((a, b) => a.name.localeCompare(b.name)); });
    return groups;
  }
  function foodListHtml(db, rowFn) {
    const groups = groupFoodsByCategory(db);
    let html = '';
    CATEGORY_ORDER.forEach(cat => {
      const items = groups[cat];
      if (!items || !items.length) return;
      html += '<div class="food-cat-label">' + CATEGORY_ICON[cat] + ' ' + escapeHtml(cat) + '</div>';
      html += items.map(rowFn).join('');
    });
    return html;
  }

  // ================================================================
  // DÉBLOAT — sodium:potassium balance, not sodium alone. WHO's own
  // sodium (<2000mg) and potassium (>=3510mg) targets work out to a
  // ~1:1 molar ratio, which WHO states explicitly as the goal ratio.
  // A high Na:K ratio (sodium retained, potassium depleted) tracks with
  // fluid retention in the physiology literature (e.g. postoperative
  // fluid-retention studies pairing a positive sodium balance with a
  // negative potassium balance) — potassium isn't just "a nutrient to
  // hit", raising it is part of how the body clears sodium and water.
  // ================================================================
  function renderDebloatCard(totals) {
    const sodiumMg = totals.salt * SODIUM_MG_PER_SALT_G;
    const potassiumMg = totals.potassium;
    const naMol = sodiumMg / NA_ATOMIC_MASS;
    const kMol = potassiumMg / K_ATOMIC_MASS;
    const ratio = kMol > 0 ? naMol / kMol : (naMol > 0 ? 99 : 0);
    const cls = ratio <= 1.0 ? 'good' : (ratio <= 1.8 ? 'mid' : 'low');
    const label = ratio <= 1.0 ? 'Ratio optimal (objectif OMS ≈ 1.0)' : (ratio <= 1.8 ? 'Ratio élevé — plus de potassium aiderait' : 'Ratio très élevé — sodium dominant, risque de rétention d\'eau');
    return '<div class="gm-card">' +
      '<div class="section-title">Débloat (sodium / potassium)</div>' +
      '<span class="program-badge ' + (cls==='good'?'':cls==='mid'?'warn':'bad') + '">Ratio Na:K — ' + ratio.toFixed(2) + '</span>' +
      '<div class="program-row"><span>Sodium (via le sel)</span><span>' + Math.round(sodiumMg) + ' mg</span></div>' +
      '<div class="program-row"><span>Potassium</span><span>' + Math.round(potassiumMg) + ' / ' + POTASSIUM_TARGET_MG + ' mg</span></div>' +
      '<div class="program-note">' + label + ' — augmenter le potassium (légumes verts, banane, patate, légumineuses) aide les reins à évacuer sodium et eau. ' +
      (potassiumMg === 0 ? 'Aucun aliment de ta base n\'a de potassium renseigné pour l\'instant — ajoute-le en modifiant tes aliments (étiquette ou table nutritionnelle) pour un ratio fiable.' : '') +
      '</div></div>';
  }

  // ================================================================
  // NEXT-DAY WEIGHT ESTIMATE — day-to-day scale weight is dominated by
  // water, not fat, so this is broken into its real components instead
  // of pretending one number is precise:
  //  - fat/lean: (today's kcal − TDEE) / 7700 kcal per kg (standard
  //    energy-density approximation) — the slow, real component.
  //  - glycogen+water: glycogen binds ~3g water per g stored (classic
  //    finding, Olsson & Saltin 1970) — proxied here by today's carbs
  //    vs. target; if training happened today, half that surplus is
  //    assumed to refill glycogen just depleted rather than add net-new
  //    storage.
  //  - sodium+water: same threshold-based rule as Eau (salt beyond 5g/
  //    day × 65ml/g).
  // Always shown as a range, not a false-precise single number.
  // ================================================================
  function trainedToday() {
    const gym = loadJSON(GYM_KEY, {});
    const today = todayStr();
    return (gym.exercises || []).some(ex => ((gym.logs && gym.logs[ex.id]) || []).some(l => l.date === today));
  }
  function renderPredictionCard(targets, totals) {
    const fatChangeKg = (totals.kcal - targets.tdee) / 7700;
    const carbSurplusG = totals.carbs - targets.carbsG;
    const trained = trainedToday();
    const glycogenWaterKg = (carbSurplusG * 3 / 1000) * (trained ? 0.5 : 1);
    const saltWaterKg = Math.max(0, totals.salt - SALT_TARGET_G) * 0.065;
    const totalChangeKg = fatChangeKg + glycogenWaterKg + saltWaterKg;
    const predicted = targets.weightKg + totalChangeKg;
    const sign = (n) => (n >= 0 ? '+' : '') + n.toFixed(2);
    return '<div class="gm-card">' +
      '<div class="section-title">Poids demain (estimation)</div>' +
      '<div class="kcal-total"><strong>' + predicted.toFixed(1) + ' kg</strong><br>±0.3 kg (variation normale)</div>' +
      '<div class="program-row" style="margin-top:10px;"><span>Graisse/masse maigre (kcal du jour)</span><span>' + sign(fatChangeKg) + ' kg</span></div>' +
      '<div class="program-row"><span>Glycogène + eau (glucides' + (trained ? ', séance aujourd\'hui' : '') + ')</span><span>' + sign(glycogenWaterKg) + ' kg</span></div>' +
      '<div class="program-row"><span>Eau (sel au-delà de ' + SALT_TARGET_G + 'g)</span><span>' + sign(saltWaterKg) + ' kg</span></div>' +
      '<div class="program-note">Le poids sur la balance d\'un jour à l\'autre est dominé par l\'eau (glycogène, sodium, digestion), pas par la graisse réelle — cette estimation sépare les deux plutôt que de prétendre à une précision qu\'aucun modèle n\'a vraiment. À lire sur la tendance de plusieurs jours (Fitness → Poids), pas jour par jour.</div>' +
      '</div>';
  }

  // ================================================================
  // CALENDRIER ALIMENTAIRE — un mois, une note/100 (voir dayScore) sur
  // chaque jour où au moins un aliment a été enregistré. Les jours vides
  // restent neutres (pas de note inventée). Touche un jour noté pour le
  // détail (journal exact, macros, humeur, repos/entraînement).
  // ================================================================
  function renderFoodCalendarCard() {
    const now = new Date();
    const todayKey = todayStr();
    const base = new Date(now.getFullYear(), now.getMonth() + foodCalMonthOffset, 1);
    const y = base.getFullYear(), m = base.getMonth();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const firstWeekday = (new Date(y, m, 1).getDay() + 6) % 7;
    const log = loadJSON(FOOD_LOG_KEY, {});

    let html = '<div class="gm-card"><div class="section-title">Calendrier alimentaire</div>' +
      '<div class="cal-head">' +
      '<button type="button" class="cal-nav-btn" id="foodCalPrev" aria-label="Mois précédent">‹</button>' +
      '<span class="cal-month">' + MONTH_NAMES[m] + ' ' + y + '</span>' +
      '<button type="button" class="cal-nav-btn" id="foodCalNext" aria-label="Mois suivant">›</button>' +
      '</div>' +
      '<div class="cal-weekdays">' + WEEKDAY_LABELS.map(d => '<div class="cal-weekday">' + d + '</div>').join('') + '</div>' +
      '<div class="cal-grid">';
    for (let i = 0; i < firstWeekday; i++) html += '<div></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(y, m, d);
      const dk = dateStr(date);
      const hasLog = !!(log[dk] && log[dk].length);
      const isToday = dk === todayKey;
      const score = hasLog ? dayScore(dk) : null;
      const color = hasLog ? scoreColor(score) : null;
      const cls = 'cal-cell' + (isToday ? ' today' : '') + (hasLog ? ' logged' : ' empty');
      html += '<button type="button" class="' + cls + '"' +
        (hasLog ? ' data-date="' + dk + '" style="border-left-color:' + color + ';"' : ' disabled') + '>' +
        '<span class="cal-day">' + d + '</span>' +
        (hasLog ? '<span class="cal-score" style="color:' + color + '">' + score + '</span>' : '<span class="cal-score cal-score-empty">·</span>') +
        '</button>';
    }
    html += '</div>' +
      '<div class="cal-legend">' +
      '<span class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--success)"></span>Proche des objectifs</span>' +
      '<span class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--danger)"></span>Loin des objectifs</span>' +
      '<span class="cal-legend-item"><span class="cal-legend-dot" style="background:rgba(255,255,255,0.15)"></span>Rien enregistré</span>' +
      '</div>' +
      '<div class="program-note">Note = distance aux kcal/macros de ce jour-là (poids, repos/entraînement et déficit reconstitués rétroactivement) — vert proche de la cible, rouge loin (trop ou pas assez). Touche un jour noté pour voir le détail.</div>' +
      '</div>';
    return html;
  }

  function openDayDetailModal(dk) {
    const bg = ensureModal();
    const inner = document.getElementById('foodModalInner');
    const entries = entriesForDate(dk);
    const totals = totalsFor(entries);
    const targets = computeTargetsForDate(dk);
    const score = dayScore(dk);
    const color = scoreColor(score);
    const overrides = loadJSON('po_day_overrides_v1', {});
    const override = overrides[dk];
    const restDay = override ? /repos|rest/i.test(override) : true;
    const dayTypeLabel = override || 'Repos (par défaut)';
    const mood = loadJSON(MOOD_KEY, {})[dk];
    const [yy, mm, dd] = dk.split('-').map(Number);
    const dateLabel = new Date(yy, mm - 1, dd).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

    inner.innerHTML = '<h3>' + escapeHtml(dateLabel) + '</h3>' +
      '<div class="day-detail-head">' +
      '<div class="day-detail-score" style="color:' + color + ';border-color:' + color + ';background:' + color.replace('rgb', 'rgba').replace(')', ',0.14)') + ';">' + score + '</div>' +
      '<div class="day-detail-badges">' +
      '<span class="program-badge' + (restDay ? ' warn' : '') + '">' + (restDay ? '😴 ' : '💪 ') + escapeHtml(dayTypeLabel) + '</span>' +
      (mood ? '<span class="program-badge">Humeur ' + (MOOD_EMOJI[mood.mood] || '') + '</span>' : '') +
      '</div>' +
      '</div>' +
      '<div class="kcal-total" style="margin-bottom:14px;"><strong>' + Math.round(totals.kcal) + '</strong> / ' + targets.target + ' kcal' +
      '<div class="kcal-remaining" style="color:var(--text-tertiary);">P' + Math.round(totals.protein) + '/' + targets.proteinG + 'g · G' + Math.round(totals.carbs) + '/' + targets.carbsG + 'g · L' + Math.round(totals.fat) + '/' + targets.fatG + 'g</div>' +
      '</div>' +
      '<div class="section-title">Journal de cette journée</div>' +
      (entries.length ? entries.map(e =>
        '<div class="log-row"><div><div class="log-name">' + escapeHtml(e.foodName) + '</div><div class="log-meta">' + e.grams + ' g · ' + e.time + '</div></div>' +
        '<span class="log-macros">' + Math.round(e.kcal) + ' kcal<br>P' + Math.round(e.protein) + ' G' + Math.round(e.carbs) + ' L' + Math.round(e.fat) + ' S' + (e.salt||0).toFixed(1) + '</span></div>'
      ).join('') : '<p class="empty-note">Rien enregistré.</p>') +
      '<div class="modal-actions"><button type="button" class="btn-secondary" id="closeDayDetail">Fermer</button></div>';
    document.getElementById('closeDayDetail').addEventListener('click', closeModal);
    bg.classList.add('show');
  }

  function renderMain() {
    const targets = computeTargets();
    const totals = todayTotals();
    const db = loadJSON(FOOD_DB_KEY, []);
    const entries = todaysEntries();

    const pP = targets.proteinG ? totals.protein / targets.proteinG : 0;
    const pC = targets.carbsG ? totals.carbs / targets.carbsG : 0;
    const pF = targets.fatG ? totals.fat / targets.fatG : 0;
    const sugarTargetG = (targets.target * SUGAR_TARGET_PCT) / 4;

    let html = '<h1 class="dash-title">Alimentation</h1>' +
      '<p class="dash-sub">Objectifs calculés à partir de ton poids réel (Fitness) et de ton profil (Eau) — recalculés à chaque visite, ajustés chaque semaine selon ta vraie perte de poids.</p>' +
      '<details class="info"><summary>D\'où viennent ces chiffres (études citées)</summary>' +
      '<p><strong>Dépense calorique (TDEE)</strong> : équation de <strong>Mifflin-St Jeor (1990)</strong> pour le métabolisme de base — jugée la plus fiable par la comparaison de <strong>Frankenfield et al. (2005)</strong> — multipliée par un facteur d\'activité selon tes heures d\'entraînement/semaine (Eau). Une séance de cardio enregistrée dans <a href="seance.html" style="color:var(--text-primary)">Séance</a> (marche/course sur tapis avec vitesse+pente, formule ACSM ; ou vélo/elliptique/rameur/natation via MET, Ainsworth et al. 2011) s\'ajoute par-dessus, en kcal réellement calculées — le facteur d\'activité hebdomadaire reste une moyenne, ça, c\'est la dépense mesurée du jour. Pour éviter de compter ce même cardio deux fois (une fois dans les heures/semaine du profil, une fois dans le calcul précis), les heures de cardio réellement loguées sur les 7 derniers jours sont retirées des heures/semaine avant de choisir le palier d\'activité — le palier ne représente donc plus que la muscu.</p>' +
      '<p><strong>Déficit adaptatif</strong> : <strong>Garthe et al. (2011)</strong> ont montré que des athlètes perdant du poids à <strong>0.7%/semaine</strong> gagnaient de la masse maigre et de la force pendant leur sèche, contrairement à ceux perdant 1.4%/semaine. Ce programme vise 0.5-0.7%/semaine et ajuste ton déficit chaque semaine selon ta perte réelle (Fitness → Poids), pas une estimation figée.</p>' +
      '<p><strong>Protéines</strong> : <strong>Helms, Aragon &amp; Fitschen (2014)</strong>, revue systématique — 1.8 à 2.7 g/kg de poids de corps pendant une restriction calorique chez les athlètes entraînés en résistance ; 2.2 g/kg utilisé ici. Le reste des calories est réparti entre lipides (plancher ~25% pour la santé hormonale) et glucides (le reste, pour soutenir l\'intensité à l\'entraînement).</p>' +
      '<p><strong>Débloat (sodium/potassium)</strong> : l\'<strong>OMS</strong> recommande &lt; 2000 mg de sodium (5g de sel) et ≥ 3510 mg de potassium par jour — ces deux seuils donnent, une fois atteints, un ratio sodium:potassium molaire d\'environ 1.0, que l\'OMS cite explicitement comme objectif. Un ratio élevé (sodium dominant, potassium faible) est associé à la rétention d\'eau dans la littérature physiologique — pas juste "trop de sel" isolément. Le sodium ici vient de tes aliments (Alimentation), pas d\'une estimation séparée.</p>' +
      '<p><strong>Lien avec l\'eau</strong> : la relation sodium→besoin en eau est débattue scientifiquement (revue <strong>Rakova et al., Annals of Nutrition &amp; Metabolism</strong>) — à apport modéré, les reins concentrent simplement l\'urine sans changer le volume d\'eau nécessaire. Mais au-delà d\'un certain seuil, les reins ne peuvent plus concentrer l\'urine davantage et un volume d\'eau supplémentaire est nécessaire pour évacuer l\'excès. C\'est pourquoi Eau n\'ajoute de l\'eau que pour le sel <strong>au-delà</strong> de l\'objectif de 5g/jour, pas proportionnellement à chaque gramme.</p>' +
      '<p><strong>Sucres</strong> : recommandation <strong>OMS (2015, ligne directrice sur les sucres)</strong> — sucres libres &lt; 10% de l\'apport énergétique total. Pertinent pour le débloat aussi : le glycogène (réserve de glucides dans le muscle/foie) retient environ <strong>3g d\'eau par gramme de glycogène stocké</strong> — un excès de sucres/glucides au-delà de ce que la séance du jour consomme se traduit en partie par de l\'eau retenue, pas juste des calories.</p>' +
      '<p><strong>Poids demain</strong> : estimation décomposée, pas un chiffre inventé — graisse/masse maigre via ~7700 kcal/kg (équivalence énergétique standard), eau via le glycogène (<strong>Olsson &amp; Saltin, 1970</strong> — ~3g d\'eau/g de glycogène) et via le sel (même règle que le lien avec l\'eau ci-dessus). Séance (Fitness) réduit l\'effet glycogène du jour puisqu\'une partie sert à recharger ce qui vient d\'être vidé. Le poids d\'un seul jour reste dominé par ces variations d\'eau — la vraie tendance se lit sur plusieurs jours (Fitness → Poids).</p>' +
      '<p><strong>Jour de repos</strong> : ce que tu as placé toi-même dans <strong>Calendrier</strong> pour aujourd\'hui décide — sans placement, la journée compte comme repos par défaut (pas de recours à la répartition de Fitness, pour ne jamais afficher un entraînement que tu n\'as pas confirmé). Un jour de repos fait baisser d\'un cran le facteur d\'activité (plancher sédentaire), au lieu d\'appliquer la même moyenne hebdomadaire tous les jours. C\'est la logique du "carb cycling" — faire correspondre l\'apport à la dépense réelle du jour — une pratique courante en musculation, pas une règle validée par un essai clinique dédié.</p>' +
      '<p><strong>Fibres</strong> : <strong>Institute of Medicine (2005)</strong>, Dietary Reference Intakes — apport adéquat de 38g/j (hommes ≤50 ans), 30g (hommes 50+), 25g (femmes ≤50 ans), 21g (femmes 50+). Gardé fixe même en déficit calorique : leur effet sur la satiété (<strong>Slavin, 2005</strong>, revue Nutrition) est justement plus utile pendant une sèche, pas moins. "Fi?" dans un aliment veut dire que la valeur n\'était pas sur l\'étiquette — compté comme 0g dans le total du jour (sous-estimation volontaire plutôt qu\'un chiffre inventé), donc ton vrai total est probablement un peu au-dessus de ce qui s\'affiche.</p>' +
      '</details>';

    const kcalRemaining = targets.target - totals.kcal;
    const fiberTarget = fiberTargetG(targets.profile);

    html += '<div class="gm-card">' +
      '<div class="section-title">Aujourd\'hui</div>' +
      '<div class="ring-row">' +
      ring(pP, ringColor(pP), totals.protein, targets.proteinG, '🥩 Protéines') +
      ring(pC, ringColor(pC), totals.carbs, targets.carbsG, '🍞 Glucides') +
      ring(pF, ringColor(pF), totals.fat, targets.fatG, '🧈 Lipides') +
      '</div>' +
      '<div class="kcal-total"><strong>' + Math.round(totals.kcal) + '</strong> / ' + targets.target + ' kcal' +
      '<div class="kcal-remaining" style="color:' + (kcalRemaining < 0 ? 'var(--danger)' : 'var(--text-tertiary)') + '">' +
      (kcalRemaining >= 0 ? 'reste ' + Math.round(kcalRemaining) + ' kcal aujourd\'hui' : 'dépassé de ' + Math.round(-kcalRemaining) + ' kcal') +
      '</div></div>' +
      '<div class="salt-row"><div class="salt-row-head"><span>🧂 Sel</span><strong>' + totals.salt.toFixed(1) + ' / ' + SALT_TARGET_G + ' g</strong></div>' +
      '<div class="salt-bar-track"><div class="salt-bar-fill" style="width:' + Math.min(100, (totals.salt/SALT_TARGET_G)*100).toFixed(0) + '%;background:' + (totals.salt > SALT_TARGET_G ? 'var(--danger)' : 'var(--lime)') + ';"></div></div></div>' +
      '<div class="salt-row"><div class="salt-row-head"><span>🍬 Sucres</span><strong>' + Math.round(totals.sugar) + ' / ' + Math.round(sugarTargetG) + ' g</strong></div>' +
      '<div class="salt-bar-track"><div class="salt-bar-fill" style="width:' + Math.min(100, (totals.sugar/sugarTargetG)*100).toFixed(0) + '%;background:' + (totals.sugar > sugarTargetG ? 'var(--danger)' : 'var(--lime)') + ';"></div></div></div>' +
      '<div class="salt-row"><div class="salt-row-head"><span>🌾 Fibres</span><strong>' + Math.round(totals.fiber) + ' / ' + fiberTarget + ' g</strong></div>' +
      '<div class="salt-bar-track"><div class="salt-bar-fill" style="width:' + Math.min(100, (totals.fiber/fiberTarget)*100).toFixed(0) + '%;background:' + (totals.fiber >= fiberTarget ? 'var(--lime)' : 'var(--warning)') + ';"></div></div></div>' +
      '</div>';

    html += renderMacroTipsCard(targets, totals, fiberTarget, db);

    html += '<div class="gm-card">' +
      '<div class="section-title">Journal du jour<button type="button" class="gm-ghost" id="addFoodBtn">+ Ajouter</button></div>' +
      (entries.length ? entries.map(e =>
        '<div class="log-row"><div><div class="log-name">' + escapeHtml(e.foodName) + '</div><div class="log-meta">' + e.grams + ' g · ' + e.time + '</div></div>' +
        '<span class="log-macros">' + Math.round(e.kcal) + ' kcal<br>P' + Math.round(e.protein) + ' G' + Math.round(e.carbs) + ' L' + Math.round(e.fat) + ' S' + (e.salt||0).toFixed(1) + '</span>' +
        '<button type="button" class="log-del" data-del="' + e.id + '" aria-label="Supprimer">×</button></div>'
      ).join('') : '<p class="empty-note">Rien enregistré aujourd\'hui.</p>') +
      '</div>';

    html += '<div class="gm-card">' +
      '<div class="section-title">Programme (sèche adaptative)</div>' +
      '<span class="program-badge">Déficit actuel : -' + targets.program.deficitPct + '%</span>' +
      (targets.restDay ? ' <span class="program-badge warn">Jour de repos — activité réduite</span>' : '') +
      '<div class="program-row"><span>Poids utilisé</span><span>' + targets.weightKg.toFixed(1) + ' kg' + (targets.weightIsLive ? ' (Fitness, live)' : ' (profil Eau)') + '</span></div>' +
      '<div class="program-row"><span>TDEE estimé' + (targets.restDay ? ' (repos)' : '') + '</span><span>' + targets.tdee + ' kcal</span></div>' +
      (targets.cardioKcal > 0 ? '<div class="program-row"><span>🏃 Cardio (Séance)</span><span>+' + targets.cardioKcal + ' kcal</span></div>' : '') +
      '<div class="program-row"><span>Objectif</span><span>' + targets.target + ' kcal</span></div>' +
      (targets.program.history && targets.program.history.length ?
        '<div class="program-note">' + escapeHtml(targets.program.history[targets.program.history.length-1].note) + '</div>' :
        '<div class="program-note">Pas encore assez de semaines de pesées pour ajuster automatiquement — le déficit de départ (-20%) est utilisé tel quel.</div>') +
      '</div>';

    html += renderPredictionCard(targets, totals);
    html += renderDebloatCard(totals);

    html += '<div class="gm-card">' +
      '<div class="section-title">Mes aliments (' + db.length + ')<button type="button" class="gm-ghost" id="manageFoodsBtn">Gérer</button></div>' +
      (db.length ? '<p class="empty-note">' + db.length + ' aliment(s) enregistré(s), synchronisés sur tous tes appareils.</p>' : '<p class="empty-note">Aucun aliment créé — touche "+ Ajouter" pour en créer un premier.</p>') +
      '</div>';

    html += renderFoodCalendarCard();
    html += CROSS_NAV;
    app.innerHTML = html;

    document.getElementById('addFoodBtn').addEventListener('click', openAddFoodModal);
    document.getElementById('manageFoodsBtn').addEventListener('click', openManageFoodsModal);
    app.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', () => { removeLogEntry(btn.dataset.del); renderMain(); });
    });
    document.getElementById('foodCalPrev').addEventListener('click', () => { foodCalMonthOffset--; renderMain(); });
    document.getElementById('foodCalNext').addEventListener('click', () => { foodCalMonthOffset++; renderMain(); });
    app.querySelectorAll('.cal-cell[data-date]').forEach(btn => {
      btn.addEventListener('click', () => openDayDetailModal(btn.dataset.date));
    });
  }

  // ---- add-food modal (pick existing or create new, then log a quantity) ----
  function ensureModal() {
    let bg = document.getElementById('foodModalBg');
    if (bg) return bg;
    bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.id = 'foodModalBg';
    bg.innerHTML = '<div class="modal" id="foodModalInner"></div>';
    document.body.appendChild(bg);
    bg.addEventListener('click', (e) => { if (e.target === bg) closeModal(); });
    return bg;
  }
  function closeModal() { const bg = document.getElementById('foodModalBg'); if (bg) bg.classList.remove('show'); }

  function openAddFoodModal() {
    const bg = ensureModal();
    const inner = document.getElementById('foodModalInner');
    let mode = 'pick'; // 'pick' | 'new'
    let selectedFood = null;
    let catFilter = 'Tous';

    function renderModal() {
      const db = loadJSON(FOOD_DB_KEY, []);
      inner.innerHTML =
        '<h3>Ajouter un aliment</h3>' +
        '<div class="seg-toggle"><button type="button" data-m="pick" class="' + (mode==='pick'?'active':'') + '">Mes aliments</button><button type="button" data-m="new" class="' + (mode==='new'?'active':'') + '">Créer</button></div>' +
        '<div id="modalBody"></div>';
      inner.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => { mode = b.dataset.m; selectedFood = null; renderModal(); }));

      const body = document.getElementById('modalBody');
      if (mode === 'pick') {
        if (!db.length) {
          body.innerHTML = '<p class="empty-note">Aucun aliment créé. Passe sur "Créer" pour en ajouter un.</p>';
          return;
        }
        const shown = catFilter === 'Tous' ? db : db.filter(f => dominantCategory(f) === catFilter);
        body.innerHTML =
          '<div class="cat-filter-row">' + ['Tous'].concat(CATEGORY_ORDER).map(cat =>
            '<button type="button" class="cat-filter-btn' + (catFilter===cat?' active':'') + '" data-cat="' + escapeHtml(cat) + '">' + (CATEGORY_ICON[cat] ? CATEGORY_ICON[cat] + ' ' : '') + escapeHtml(cat) + '</button>'
          ).join('') + '</div>' +
          '<div class="food-pick-list">' + (shown.length ? foodListHtml(shown, f =>
            '<div class="food-pick-item' + (selectedFood && selectedFood.id===f.id ? ' active':'') + '" data-id="' + f.id + '">' +
            '<div style="flex:1"><div class="food-pick-name">' + escapeHtml(f.name) + '</div><div class="food-pick-macro">' + f.kcalPer100g + ' kcal/100g' + (f.servingGrams ? ' · 1 ' + escapeHtml(f.servingLabel||'unité') + ' = ' + f.servingGrams + 'g' : '') + '</div></div>' +
            '<button type="button" class="food-pick-del" data-fdel="' + f.id + '">🗑</button>' +
            '</div>'
          ) : '<p class="empty-note">Rien dans cette catégorie.</p>') + '</div>' +
          (selectedFood ? renderQuantityForm(selectedFood) : '');
        body.querySelectorAll('[data-cat]').forEach(b => {
          b.addEventListener('click', () => { catFilter = b.dataset.cat; selectedFood = null; renderModal(); });
        });
        body.querySelectorAll('.food-pick-item').forEach(el => {
          el.addEventListener('click', (e) => {
            if (e.target.closest('[data-fdel]')) return;
            selectedFood = db.find(f => f.id === el.dataset.id);
            renderModal();
          });
        });
        body.querySelectorAll('[data-fdel]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const list = loadJSON(FOOD_DB_KEY, []).filter(f => f.id !== btn.dataset.fdel);
            saveJSON(FOOD_DB_KEY, list);
            if (selectedFood && selectedFood.id === btn.dataset.fdel) selectedFood = null;
            renderModal();
          });
        });
        wireQuantityForm(body);
      } else {
        body.innerHTML =
          '<div class="field-row">' +
          '<div class="field-col" style="flex:1 1 100%"><label>Nom</label><input type="text" id="newFoodName" placeholder="ex. Steak haché 5%"></div>' +
          '</div>' +
          '<div class="field-row">' +
          '<div class="field-col"><label>Kcal /100g</label><input type="number" id="newFoodKcal" step="1"></div>' +
          '<div class="field-col"><label>Protéines /100g</label><input type="number" id="newFoodP" step="0.1"></div>' +
          '</div>' +
          '<div class="field-row">' +
          '<div class="field-col"><label>Glucides /100g</label><input type="number" id="newFoodC" step="0.1"></div>' +
          '<div class="field-col"><label>dont Sucres /100g</label><input type="number" id="newFoodSugar" step="0.1" placeholder="ex. 5"></div>' +
          '</div>' +
          '<div class="field-row">' +
          '<div class="field-col"><label>Lipides /100g</label><input type="number" id="newFoodF" step="0.1"></div>' +
          '<div class="field-col"><label>Fibres /100g (laisse vide si absent de l\'étiquette)</label><input type="number" id="newFoodFiber" step="0.1" placeholder="ex. 3"></div>' +
          '</div>' +
          '<div class="field-row">' +
          '<div class="field-col"><label>Sel /100g (g)</label><input type="number" id="newFoodSalt" step="0.01" placeholder="ex. 1.2"></div>' +
          '<div class="field-col"><label>Potassium /100g (mg)</label><input type="number" id="newFoodK" step="1" placeholder="ex. 350"></div>' +
          '</div>' +
          '<div class="field-row">' +
          '<div class="field-col"><label>1 unité = ? g (optionnel)</label><input type="number" id="newFoodServingG" step="1" placeholder="ex. 150"></div>' +
          '<div class="field-col"><label>Nom de l\'unité</label><input type="text" id="newFoodServingLabel" placeholder="ex. steak"></div>' +
          '</div>' +
          '<div class="modal-actions"><button type="button" class="btn-secondary" id="cancelNewFood">Annuler</button><button type="button" class="btn-primary" id="saveNewFood">Créer</button></div>';
        document.getElementById('cancelNewFood').addEventListener('click', closeModal);
        document.getElementById('saveNewFood').addEventListener('click', () => {
          const name = document.getElementById('newFoodName').value.trim();
          const kcalPer100g = parseFloat(document.getElementById('newFoodKcal').value) || 0;
          if (!name || !kcalPer100g) { alert('Nom et kcal/100g requis.'); return; }
          const food = {
            id: uid(), name,
            kcalPer100g,
            proteinPer100g: parseFloat(document.getElementById('newFoodP').value) || 0,
            carbsPer100g: parseFloat(document.getElementById('newFoodC').value) || 0,
            sugarPer100g: parseFloat(document.getElementById('newFoodSugar').value) || 0,
            fatPer100g: parseFloat(document.getElementById('newFoodF').value) || 0,
            fiberPer100g: document.getElementById('newFoodFiber').value.trim() === '' ? null : parseFloat(document.getElementById('newFoodFiber').value) || 0,
            saltPer100g: parseFloat(document.getElementById('newFoodSalt').value) || 0,
            potassiumPer100g: parseFloat(document.getElementById('newFoodK').value) || 0,
            servingGrams: parseFloat(document.getElementById('newFoodServingG').value) || null,
            servingLabel: document.getElementById('newFoodServingLabel').value.trim() || null
          };
          const list = loadJSON(FOOD_DB_KEY, []).concat([food]);
          saveJSON(FOOD_DB_KEY, list);
          selectedFood = food; mode = 'pick';
          renderModal();
        });
      }
    }

    function renderQuantityForm(food) {
      const useServing = !!food.servingGrams;
      const nowHM = new Date().toTimeString().slice(0, 5);
      return '<div class="gm-card" style="margin-top:10px;">' +
        '<div class="field-row">' +
        (useServing ?
          '<div class="field-col"><label>Nombre de ' + escapeHtml(food.servingLabel || 'unités') + ' (1 = ' + food.servingGrams + 'g)</label><input type="number" id="qtyUnits" step="0.25" value="1"></div>' :
          '<div class="field-col"><label>Grammes</label><input type="number" id="qtyGrams" step="1" value="100"></div>') +
        '<div class="field-col"><label>Heure</label><input type="time" id="qtyTime" value="' + nowHM + '"></div>' +
        '</div>' +
        '<div class="modal-actions"><button type="button" class="btn-secondary" id="cancelQty">Annuler</button><button type="button" class="btn-primary" id="saveQty">Ajouter au journal</button></div>' +
        '</div>';
    }
    function wireQuantityForm(body) {
      const cancelBtn = body.querySelector('#cancelQty');
      const saveBtn = body.querySelector('#saveQty');
      if (cancelBtn) cancelBtn.addEventListener('click', closeModal);
      if (saveBtn) saveBtn.addEventListener('click', () => {
        const f = selectedFood;
        let grams;
        const unitsEl = body.querySelector('#qtyUnits'), gramsEl = body.querySelector('#qtyGrams');
        if (unitsEl) grams = (parseFloat(unitsEl.value) || 0) * f.servingGrams;
        else grams = parseFloat(gramsEl.value) || 0;
        if (!grams) { alert('Quantité invalide.'); return; }
        const ratio = grams / 100;
        const timeEl = body.querySelector('#qtyTime');
        const time = (timeEl && timeEl.value) ? timeEl.value : new Date().toTimeString().slice(0, 5);
        addLogEntry({
          foodId: f.id, foodName: f.name, grams: Math.round(grams), time: time,
          kcal: f.kcalPer100g * ratio, protein: f.proteinPer100g * ratio,
          carbs: f.carbsPer100g * ratio, fat: f.fatPer100g * ratio,
          salt: (f.saltPer100g || 0) * ratio, potassium: (f.potassiumPer100g || 0) * ratio,
          sugar: (f.sugarPer100g || 0) * ratio, fiber: (f.fiberPer100g || 0) * ratio
        });
        closeModal();
        renderMain();
      });
    }

    renderModal();
    bg.classList.add('show');
  }

  function openManageFoodsModal() {
    const bg = ensureModal();
    const inner = document.getElementById('foodModalInner');
    let catFilter = 'Tous';
    function render() {
      const db = loadJSON(FOOD_DB_KEY, []);
      const shown = catFilter === 'Tous' ? db : db.filter(f => dominantCategory(f) === catFilter);
      inner.innerHTML = '<h3>Mes aliments</h3>' +
        (db.length ?
          '<div class="cat-filter-row">' + ['Tous'].concat(CATEGORY_ORDER).map(cat =>
            '<button type="button" class="cat-filter-btn' + (catFilter===cat?' active':'') + '" data-cat="' + escapeHtml(cat) + '">' + (CATEGORY_ICON[cat] ? CATEGORY_ICON[cat] + ' ' : '') + escapeHtml(cat) + '</button>'
          ).join('') + '</div>' +
          '<div class="food-pick-list">' + (shown.length ? foodListHtml(shown, f =>
            '<div class="food-pick-item"><div style="flex:1"><div class="food-pick-name">' + escapeHtml(f.name) + '</div>' +
            '<div class="food-pick-macro">' + f.kcalPer100g + ' kcal · P' + f.proteinPer100g + ' G' + f.carbsPer100g + ' L' + f.fatPer100g + ' Fi' + (f.fiberPer100g == null ? '?' : f.fiberPer100g) + ' S' + (f.saltPer100g||0) + ' K' + (f.potassiumPer100g||0) + 'mg /100g' + (f.servingGrams ? ' · 1 ' + escapeHtml(f.servingLabel||'unité') + ' = ' + f.servingGrams + 'g' : '') + '</div></div>' +
            '<button type="button" class="food-pick-del" data-fdel2="' + f.id + '">🗑</button></div>'
          ) : '<p class="empty-note">Rien dans cette catégorie.</p>') + '</div>' :
          '<p class="empty-note">Aucun aliment créé pour l\'instant.</p>') +
        '<div class="modal-actions"><button type="button" class="btn-secondary" id="closeManage">Fermer</button></div>';
      document.getElementById('closeManage').addEventListener('click', closeModal);
      inner.querySelectorAll('[data-cat]').forEach(b => {
        b.addEventListener('click', () => { catFilter = b.dataset.cat; render(); });
      });
      inner.querySelectorAll('[data-fdel2]').forEach(btn => {
        btn.addEventListener('click', () => {
          const list = loadJSON(FOOD_DB_KEY, []).filter(f => f.id !== btn.dataset.fdel2);
          saveJSON(FOOD_DB_KEY, list);
          render();
        });
      });
    }
    render();
    bg.classList.add('show');
  }

  renderMain();
})();
</script>
<script id="atmo-backdrop-js">
(function () {
  function spawnParticles() {
    var root = document.getElementById('atmoParticles');
    if (!root) return;
    root.innerHTML = '';
    var N = window.innerWidth < 640 ? 12 : 20;
    for (var i = 0; i < N; i++) {
      var s = document.createElement('span');
      s.style.left = (Math.random() * 100) + '%';
      s.style.top = (55 + Math.random() * 45) + '%';
      var size = 1.1 + Math.random() * 1.2;
      s.style.width = s.style.height = size + 'px';
      var dur = 24 + Math.random() * 30;
      s.style.animationDuration = dur + 's';
      s.style.animationDelay = (-Math.random() * dur) + 's';
      s.style.setProperty('--dx', (Math.random() * 28 - 14) + 'px');
      s.style.setProperty('--dy', -(55 + Math.random() * 45) + 'vh');
      root.appendChild(s);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', spawnParticles);
  else spawnParticles();
})();
</script>
</body>
</html>
